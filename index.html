    try {
      this.renderAuth('보내는 중…');
      await Sync.call('/api/auth/request', { method: 'POST', body: JSON.stringify({ email }) });
      Log.ev('login', 'request');
      this.renderAuth('메일로 여섯 자리를 보냈습니다');
      document.getElementById('loginCode').focus();
    } catch (e) {
      Log.ev('login', 'fail');
      this.renderAuth(AUTH_ERRORS[e.code] || '안 됐습니다 · 잠시 뒤에 다시');
    } finally { this.authBusy = false; }
  },

  /* 코드는 기기가 아니라 메일 주소에 묶여 있다 — 어느 기기에서 받았든
     아무 기기에나 넣으면 된다. 그래서 코드 칸은 늘 열려 있다. */
  async verifyCode() {
    if (this.authBusy) return;
    this.authBusy = true;
    const email = document.getElementById('loginEmail').value.trim();
    const code = document.getElementById('loginCode').value.trim();
    try {
      this.renderAuth('확인 중…');
      const out = await Sync.call('/api/auth/verify', {
        method: 'POST', body: JSON.stringify({ email, code }),
      });
      Sync.email = out.email;
      Log.ev('login', 'verify');
      this.authStep = null;
      this.renderAuth('맞추는 중…');
      await this.firstLink();
      Sync.begin();
    } catch (e) {
      this.renderAuth(AUTH_ERRORS[e.code] || '안 됐습니다 · 잠시 뒤에 다시');
    } finally { this.authBusy = false; }
  },

  /* 기기를 처음 이을 때 — 양쪽에 다 기록이 있으면 합치기 전에 물어본다.
     한쪽만 있으면 물을 것이 없다. 그냥 맞춘다. */
  async firstLink() {
    const mine = Object.keys(this.allWeeks()).length;
    let theirs = 0;
    try {
      const peek = await Sync.peek();
      if (this.applyReset(peek.resetAt)) return;      // 그 사이 비워졌다면 그것부터
      theirs = Object.keys(peek.weeks || {}).length;
    } catch (e) { /* 못 보면 그냥 합친다 */ }

    if (mine && theirs) {
      document.getElementById('linkRow').hidden = false;
      this.renderAuth('이 기기에 ' + mine + '주, 서버에 ' + theirs + '주가 있습니다 · 어떻게 할까요');
      return;
    }
    await Sync.syncAll();
    this.renderAuth();
  },

  bindLink() {
    const done = async (msg, before) => {
      document.getElementById('linkRow').hidden = true;
      this.renderAuth(msg);
      try {
        if (before) await before();
        await Sync.syncAll();
        Sync.begin();
        this.renderAuth();
      } catch (e) { this.renderAuth('안 됐습니다 · 잠시 뒤에 다시'); }
    };
    document.getElementById('linkMerge').addEventListener('click',
      () => done('합치는 중…'));
    /* 서버를 비우되 이 기기 것은 남긴다 — 곧바로 올려 새 출발점으로 삼는다 */
    document.getElementById('linkMine').addEventListener('click',
      () => done('이 기기 것으로 맞추는 중…', () => Sync.wipe(true)));
    /* 서버는 그대로 두고 내 것을 버린다 — 올릴 것이 없으면 서버 것만 내려온다 */
    document.getElementById('linkTheirs').addEventListener('click',
      () => done('서버 것으로 맞추는 중…', async () => this.clearLocalWeeks()));

    /* 전부 비우기 — 되돌릴 수 없으므로 두 번 눌러야 한다 */
    const wipeBtn = document.getElementById('wipeBtn');
    wipeBtn.addEventListener('click', async () => {
      if (!this.wipeArmed) {
        this.wipeArmed = true;
        wipeBtn.textContent = '정말 비웁니다';
        this.renderAuth('한 번 더 누르면 서버와 모든 기기의 기록이 지워집니다 · 되돌릴 수 없습니다');
        clearTimeout(this.wipeTimer);
        this.wipeTimer = setTimeout(() => {
          this.wipeArmed = false;
          wipeBtn.textContent = '전부 비우기';
          this.renderAuth();
        }, 5000);
        return;
      }
      clearTimeout(this.wipeTimer);
      this.wipeArmed = false;
      wipeBtn.textContent = '전부 비우기';
      this.renderAuth('비우는 중…');
      try {
        await Sync.wipe(false);
        this.renderAuth('전부 비웠습니다 · 다른 기기도 열면 비워집니다');
      } catch (e) {
        this.renderAuth('비우지 못했습니다 · 잠시 뒤에 다시');
      }
    });
  },

  renderAuth(msg) {
    const el = id => document.getElementById(id);
    const on = this.authStep === 'login';
    /* 서버가 없으면 계정 줄 자체를 내보이지 않는다 — 라벨만 남아 빈 줄이 되지 않게 */
    el('authRow').hidden = !Sync.ready && !Sync.email;
    el('loginBtn').hidden = !Sync.ready || !!Sync.email || on;
    el('logoutBtn').hidden = !Sync.email;
    el('loginEmail').hidden = !on;
    el('sendCode').hidden = !on;
    el('codeRow').hidden = !on;
    el('wipeRow').hidden = !Sync.email || on;
    if (!Sync.email) { el('linkRow').hidden = true; this.wipeArmed = false; }
    if (!this.wipeArmed) el('wipeBtn').textContent = '전부 비우기';
    /* 머리말의 사람 표시도 같이 바뀐다 */
    el('acctBtn').classList.toggle('on', !!Sync.email);
    el('authMsg').textContent = msg || (Sync.email
      ? Sync.email + ' · 자동으로 맞춰집니다'
      : on ? '메일로 받은 여섯 자리를 넣으세요 · 없으면 코드 받기'
           : '이 기기에만 저장됩니다');
  },

  openGuide() {
    if (this.guideOn) return;
    this.guideOn = true;
    this.realWeek = this.week;
    this.week = guideSample(this.week.weekId);
    this.render();
    document.getElementById('guide').hidden = false;
    requestAnimationFrame(() => { this.layoutGuideSheet(); this.layoutGuideHints(); });
  },

  closeGuide() {
    if (!this.guideOn) return;
    document.getElementById('guide').hidden = true;
    document.getElementById('guideHints').innerHTML = '';
    this.guideOn = false;
    this.week = this.realWeek;
    this.realWeek = null;
    this.render();
  },

  guideAnchor(at) {
    const cell = this.cells[at[1]];
    if (!cell) return null;
    if (at[0] === 'label') return cell.section.querySelector('.cell-label');
    if (at[0] === 'item') return cell.items[at[2]] ? cell.items[at[2]].textEl : null;
    return cell.listEl;
  },

  /* 셀로판지 한 장 — 주간 표보다 조금 크게 덮어 덧댄 장으로 보이게 하고,
     오른쪽 아래 모서리를 접어 치울 수 있음을 알린다. */
  layoutGuideSheet() {
    const svg = document.getElementById('guideSheet');
    const body = document.getElementById('weekBody');
    const bar = document.querySelector('.guide-bar');
    if (!svg || !body) return;

    const b = body.getBoundingClientRect();
    const over = 6;      // 종이 밖으로 걸치는 정도 (px)
    const fold = 24;     // 접힌 모서리 크기 (px)
    const left = b.left - over;
    const top = b.top - over;
    const w = Math.max(60, (b.right + over) - left);
    const h = Math.max(60, (bar ? bar.getBoundingClientRect().top - 10 : b.bottom) - top);

    svg.style.left = Math.round(left) + 'px';
    svg.style.top = Math.round(top) + 'px';
    svg.style.width = Math.round(w) + 'px';
    svg.style.height = Math.round(h) + 'px';
    svg.setAttribute('viewBox', '0 0 ' + Math.round(w) + ' ' + Math.round(h));

    const x1 = (w - 0.5).toFixed(1), y1 = (h - 0.5).toFixed(1);
    const xf = (w - 0.5 - fold).toFixed(1), yf = (h - 0.5 - fold).toFixed(1);
    svg.querySelector('.film').setAttribute('d',
      'M0.5,0.5 H' + x1 + ' V' + yf + ' L' + xf + ',' + y1 + ' H0.5 Z');
    svg.querySelector('.flap').setAttribute('d',
      'M' + xf + ',' + y1 + ' L' + x1 + ',' + yf + ' L' + x1 + ',' + y1 + ' Z');
  },

  /* 설명은 가리키는 것의 오른쪽에 놓고, 요일 열 안에서 끝낸다 */
  layoutGuideHints() {
    const wrap = document.getElementById('guideHints');
    wrap.innerHTML = '';
    const daysEl = document.querySelector('.days');
    if (!daysEl) return;
    const daysRight = daysEl.getBoundingClientRect().right;

    GUIDE_HINTS.forEach(h => {
      const anchor = this.guideAnchor(h.at);
      if (!anchor) return;
      const r = anchor.getBoundingClientRect();
      let left = h.plain ? r.left : r.right + 10;
      let top = h.plain ? r.top + 6 : r.top - 2;
      let width = daysRight - left - 6;
      /* 오른쪽에 자리가 없으면(좁은 화면) 그 아랫줄로 내린다.
         요일 열 밖으로 삐져나가면 note 칸 글자와 겹친다. */
      if (!h.plain && width < 104) {
        left = r.left;
        top = r.bottom + 2;
        width = daysRight - left - 6;
      }

      const el = document.createElement('div');
      el.className = 'guide-hint' + (h.plain ? ' plain' : '');
      el.style.left = Math.round(left) + 'px';
      el.style.top = Math.round(top) + 'px';
      el.style.width = Math.round(Math.max(60, width)) + 'px';
      if (h.plain) {
        el.appendChild(document.createElement('span')).textContent = h.tail;
      } else {
        el.appendChild(document.createElement('i')).textContent = '←';
        const span = el.appendChild(document.createElement('span'));
        span.appendChild(document.createElement('b')).textContent = h.verb;
        span.appendChild(document.createTextNode(' — ' + h.tail));
      }
      wrap.appendChild(el);

      if (h.ring) {
        const ring = wrap.appendChild(document.createElement('div'));
        ring.className = 'guide-ring';
        ring.style.left = Math.round(r.left - 6) + 'px';
        ring.style.top = Math.round(r.top - 3) + 'px';
        ring.style.width = Math.round(r.width + 12) + 'px';
        ring.style.height = Math.round(r.height + 6) + 'px';
      }
    });
  },

  /* ── 적기: 인라인 입력, 엔터로 연속 입력 ─────────────────── */
  openEntry(dayKey, listEl) {
    const open = listEl.querySelector('.entry');
    if (open) { open.focus(); return; }

    const input = document.createElement('input');
    input.className = 'entry';
    input.type = 'text';
    input.setAttribute('autocomplete', 'off');
    input.setAttribute('autocapitalize', 'sentences');
    input.setAttribute('enterkeyhint', 'enter');

    let closed = false;
    const release = this.keepVisible(input);
    const close = () => {
      if (closed) return;
      closed = true;
      release();
      input.remove();
      listEl.scrollLeft = 0;         // 넘친 항목은 칸을 나눠야 보인다
      listEl.scrollTop = 0;
      this.refreshCell(dayKey);
      Sync.push();                   // 적기를 마쳤으니 이제 맞춰도 된다
    };

    /* 적힌 것이 있으면 항목으로 확정한다. 엔터로도, 딴 데를 눌러도 같다. */
    const commitText = () => {
      const text = input.value.trim();
      if (!text) return false;

      const now = Date.now();
      const data = {
        id: String(++uidSeq) + '-' + now,
        text, struck: false, createdAt: now, updatedAt: now, strikes: [],
      };
      this.week.days[dayKey].push(data);
      this.save();
      /* 글자는 보내지 않는다. 길이만 — 한 줄에 안 들어가는 일이 잦은지 보려고 */
      Log.ev('add', dayKey === 'free' ? 'free' : 'day',
             text.length, this.week.days[dayKey].length);

      const item = this.makeItem(data, dayKey, listEl);
      listEl.insertBefore(item.el, input);    // 입력창은 늘 목록 맨 아래
      if (this.cells[dayKey]) this.cells[dayKey].items.push(item);
      item.restore();
      this.refreshCell(dayKey);               // 항목이 늘면 열이 늘고, 남으면 잘렸다고 표시된다
      input.value = '';                       // 다음 줄 입력창이 바로 이어짐
      return true;
    };

    input.addEventListener('keydown', e => {
      if (e.key !== 'Enter') return;
      e.preventDefault();
      if (!commitText()) { close(); input.blur(); }   // 빈 채로 엔터 = 종료
    });
    input.addEventListener('blur', () => { commitText(); close(); });
    /* blur만 믿지 않는다. 모바일 키보드는 blur 시점이 제각각이고, 앱이 뒤로
       넘어가면 아예 안 올 수도 있다. 적은 것이 사라지는 것보다 나쁜 일은 없으므로
       "딴 데를 누른 순간"과 "화면을 떠나는 순간"에도 확정한다. */
    keepText(input, () => { commitText(); close(); });
    typeSound(input);

    listEl.appendChild(input);
    input.focus();
  },

  /* ── 요일 아래 메모 — 6.5pt 세미볼드 ─────────────────────── */
  openSublabel(key, gutter, sub) {
    if (gutter.querySelector('.sublabel-entry')) return;

    const input = document.createElement('input');
    input.className = 'sublabel-entry';
    input.type = 'text';
    input.value = this.week.notes[key] || '';
    input.setAttribute('enterkeyhint', 'done');

    let closed = false;
    const release = this.keepVisible(input);
    const commit = () => {
      if (closed) return;
      closed = true;
      release();
      const text = input.value.trim();
      input.remove();
      this.week.notes[key] = text;
      this.week.noteAt[key] = Date.now();
      Log.ev('note', text ? 'set' : 'clear', text.length);
      sub.textContent = text;
      sub.hidden = false;
      this.save();
      this.updateOverflow(key);      // 메모가 한 줄 차지하면 항목이 밀린다
    };
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); input.blur(); }
    });
    input.addEventListener('blur', commit);
    keepText(input, commit);
    typeSound(input);

    sub.hidden = true;
    gutter.appendChild(input);
    input.focus();
    input.setSelectionRange(input.value.length, input.value.length);
  },

  /* ── 편집: 그어진 항목은 편집 불가 ───────────────────────── */
  editItem(item, dayKey, listEl) {
    if (item.data.struck) return;
    const input = document.createElement('input');
    input.className = 'entry';
    input.type = 'text';
    input.value = item.data.text;
    input.setAttribute('enterkeyhint', 'done');

    let closed = false;
    const release = this.keepVisible(input);
    const commit = () => {
      if (closed) return;
      closed = true;
      release();
      const text = input.value.trim();
      input.remove();
      if (!text) { this.removeItem(item, dayKey); return; }
      item.data.text = text;
      item.data.updatedAt = Date.now();
      Log.ev('edit', dayKey === 'free' ? 'free' : 'day', text.length);
      item.textEl.textContent = text;
      this.save();
      item.el.hidden = false;                 // 제자리에 그대로 둔다
      this.refreshCell(dayKey);
    };

    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); input.blur(); }
    });
    input.addEventListener('blur', commit);
    keepText(input, commit);
    typeSound(input);

    item.el.hidden = true;
    listEl.insertBefore(input, item.el);
    input.focus();
    input.setSelectionRange(input.value.length, input.value.length);
  },

  /* ── 삭제: 롱프레스. 확인 다이얼로그 없음 ────────────────── */
  removeItem(item, dayKey) {
    Log.ev('del', dayKey === 'free' ? 'free' : 'day', item.data.struck ? 1 : 0);
    const list = this.week.days[dayKey];
    const i = list.indexOf(item.data);
    if (i >= 0) list.splice(i, 1);
    /* 지웠다는 사실을 남긴다. 없으면 다른 기기와 합칠 때 되살아난다 */
    if (item.data.id) this.week.graves[item.data.id] = Date.now();
    this.save();
    item.el.remove();
    const cell = this.cells[dayKey];
    if (cell) {
      const j = cell.items.indexOf(item);
      if (j >= 0) cell.items.splice(j, 1);
      this.refreshCell(dayKey);
    }
  },
};

/* ═══════════════════════════════════════════════════════════════
   8. 확대 차단 — iOS 사파리는 user-scalable=no를 무시하므로 직접 막는다
   ═══════════════════════════════════════════════════════════════ */
['gesturestart', 'gesturechange', 'gestureend'].forEach(type => {
  document.addEventListener(type, e => e.preventDefault(), { passive: false });
});
document.addEventListener('touchmove', e => {
  if (e.touches.length > 1) e.preventDefault();   /* 두 손가락 = 확대 시도 */
}, { passive: false });

App.init();
</script>
</body>
</html>
