<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Clear Week">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-512.png" sizes="512x512">
<link rel="manifest" href="manifest.webmanifest">
<title>Clear Week</title>
<style>
  :root {
    color-scheme: light;       /* 다크모드에서도 색이 뒤집히지 않게 */
    --paper: #ffffff;          /* 배경: 흰색 */
    --ink: #1d2b50;            /* 본문 잉크: 짙은 남색 */
    --ink-faint: #9a9eab;      /* 보조 텍스트 */
    --rule: #dedede;           /* 칸 구분선 — 중성 회색 */
    --rule-soft: #ededed;      /* 더 옅은 선 */

    /* 글자 크기 — 종이 플래너의 작은 손글씨에 가깝게 */
    --item-font: 9.5pt;
    --free-font: 9.5pt;
    --sublabel-font: 6.5pt;    /* 요일 아래 작은 메모 */

    /* 칸을 나눌수록 그 칸의 글씨와 행이 작아진다 — 좁아진 칸에 작게 쓰듯 */
    --split-scale-1: 0.84;     /* 한 번 나눴을 때 */
    --split-scale-2: 0.72;     /* 두 번 나눴을 때 */

    /* 한 화면에 한 주가 다 들어가야 하므로 행은 촘촘하게 */
    --item-height: 26px;       /* 항목 한 줄 높이 */
    --label-w: 38px;           /* 날짜 라벨이 차지하는 왼쪽 폭 = 들여쓰기 기준 */
    --col-gap: 16px;           /* 열 사이 간격 — 선이 없으므로 여백이 경계다 */

    /* 오른쪽 자유 칸 — 종이 플래너의 우측 여백 */
    --free-width: clamp(84px, 27%, 132px);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { height: 100%; background: var(--paper); touch-action: none; }
  body {
    position: fixed; inset: 0; overflow: hidden;   /* 페이지 스크롤 없음 */
    touch-action: none;                            /* 확대·더블탭 확대 차단 */
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
                 "Pretendard", "Noto Sans KR", "Segoe UI", sans-serif;
    -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
    overscroll-behavior: none;
  }
  main {
    height: 100%;
    max-width: 560px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    padding: calc(env(safe-area-inset-top, 0px) + 14px)
             calc(env(safe-area-inset-right, 0px) + 18px)
             calc(env(safe-area-inset-bottom, 0px) + 14px)
             calc(env(safe-area-inset-left, 0px) + 18px);
    transform: translateY(var(--kb-shift, 0px));   /* 키보드가 올라올 때만 밀림 */
  }

  /* ── 주 머리 ─────────────────────────────────────────────── */
  header {
    flex: none;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--rule);
  }
  header h1 { font-size: 15px; font-weight: 700; }
  header .nav { display: flex; gap: 2px; }
  header button {
    border: none; background: none; font: inherit;
    font-size: 20px; line-height: 1; color: var(--ink);
    width: 40px; height: 36px; cursor: pointer;
  }
  .note-line {
    flex: none; font-size: 11px; color: var(--ink-faint); padding-top: 4px;
  }
  /* 저장이 막혔을 때 — 조용하되 눈에는 들어와야 한다 */
  .note-line.warn { color: var(--ink); font-weight: 600; }

  /* 백업 — 제목을 꾹 누르면 열리는 한 줄. 설정 화면은 두지 않는다 */
  .backup[hidden] { display: none; }        /* 클래스가 [hidden]을 이기지 않게 */
  .backup {
    flex: none;
    display: flex; align-items: baseline; gap: 12px;
    padding-top: 5px;
    font-size: 11px; color: var(--ink-faint);
  }
  .backup button {
    border: none; background: none; font: inherit;
    font-size: 11px; font-weight: 600; color: var(--ink);
    padding: 2px 0; cursor: pointer; touch-action: none;
  }
  .backup .msg { flex: 1 1 auto; min-width: 0; text-align: right; overflow-wrap: anywhere; }

  /* ── 한 주 = 한 장. 스크롤 없이 화면에 고정 ───────────────── */
  .week {
    flex: 1 1 auto; min-height: 0;
    display: grid;
    grid-template-columns: 1fr var(--free-width);
    border-bottom: 1px solid var(--rule);   /* 아래만 닫고 좌우는 연다 */
  }
  .days {
    min-height: 0; min-width: 0;
    display: grid;
    grid-template-rows: repeat(7, 1fr);
  }
  .days .cell.day:last-child { border-bottom: none; }   /* 표 아랫선과 겹치지 않게 */
  .free {
    min-height: 0; min-width: 0;
    border-left: 1px solid var(--rule);
    padding-left: 10px;
  }

  /* ── 칸 ──────────────────────────────────────────────────── */
  .cell {
    position: relative;
    min-height: 0; min-width: 0;
    overflow: hidden;
    display: flex;
    touch-action: none;      /* 가로 = 긋기, 세로 = 열 나누기. 스크롤 없음 */
  }
  .cell.day { flex-direction: row; border-bottom: 1px solid var(--rule); }
  .cell.free-cell { flex-direction: column; }

  /* 나눈 횟수만큼 그 칸의 글씨·행이 작아진다 */
  .cell { --fs: 1; }
  .cell[data-splits="1"] { --fs: var(--split-scale-1); }
  .cell[data-splits="2"] { --fs: var(--split-scale-2); }

  /* 라벨 = 살짝 누르면 항목 추가, 꾹 눌러 아래로 끌면 요일 아래 메모 */
  .cell-gutter { display: flex; flex-direction: column; min-width: 0; }
  .cell.day > .cell-gutter { flex: 0 0 var(--label-w); align-self: flex-start; }
  .cell.free-cell > .cell-gutter { flex: none; width: 100%; }

  .cell-label {
    border: none; background: none; font: inherit;
    font-size: 10px; font-weight: 700; letter-spacing: 0.01em;
    color: var(--ink-faint);
    text-align: left; cursor: pointer;
    padding: 7px 0 0;
    touch-action: none;
  }
  .cell.free-cell .cell-label { letter-spacing: 0.06em; padding-bottom: 2px; }

  .sublabel, .sublabel-entry {
    font-family: inherit;
    font-size: var(--sublabel-font);
    font-weight: 600;                 /* 세미볼드 */
    line-height: 1.35;
    color: var(--ink);
    padding: 2px 0 0;
    overflow-wrap: anywhere;
  }
  .sublabel { cursor: pointer; }
  .sublabel:empty { display: none; }
  .sublabel-entry {
    width: 100%; border: none; background: none; outline: none;
    -webkit-user-select: text; user-select: text;
  }

  /* 항목이 흐르는 영역. 열을 나누면 여기가 여러 단이 된다 */
  .cell-body {
    flex: 1 1 auto; min-width: 0; height: 100%;
    column-gap: var(--col-gap);
    /* 열 수를 항목 수가 정하므로 고르게 나눠 담는다.
       왼쪽부터 채우면(auto) 7개일 때 셋째 단이 비는데, 글씨만 작아지고
       자리는 안 생긴다. 나눈 만큼 실제로 나눠 담겨야 한다. */
    column-fill: balance;
    overflow: hidden;
  }

  /* ── 항목 ────────────────────────────────────────────────── */
  .item[hidden] { display: none; }   /* 클래스가 [hidden]을 이기지 않게 */
  .item {
    position: relative;
    min-height: calc(var(--item-height) * var(--fs));
    display: flex;
    align-items: center;
    padding: 3px 2px;
    break-inside: avoid;
    cursor: default;
  }
  .item.purging { opacity: 0.3; }        /* 꾹 누른 뒤 드래그로 걸린 항목 */
  .item-text { font-size: calc(var(--item-font) * var(--fs)); line-height: 1.45; overflow-wrap: anywhere; }
  .free .item-text, .free .entry { font-size: calc(var(--free-font) * var(--fs)); }
  .strike-svg {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    overflow: visible; pointer-events: none;
    transform-origin: 50% 50%;
  }
  .item.pulse .strike-svg { animation: settle 120ms ease-out; }
  @keyframes settle {
    0%   { transform: scale(1, 1); }
    40%  { transform: scale(1.01, 1.12); }
    100% { transform: scale(1, 1); }
  }

  /* 칸이 꽉 차서 잘린 항목이 있다는 표시. 칸을 나누면 사라진다 */
  .overflow-mark {
    position: absolute; right: 0; bottom: 1px;
    font-size: var(--sublabel-font); font-weight: 700; line-height: 1.2;
    color: var(--ink-faint);
    background: var(--paper);
    padding: 1px 0 1px 4px;
    pointer-events: none;
  }

  /* ── 첫 실행 안내 — 표본 주 위에 설명을 얹는다 ──────────────
     화면을 가리지 않는다. 실제로 쓰이는 자리 옆에 한 마디씩 붙는다. */
  .guide[hidden] { display: none; }     /* 클래스가 [hidden]을 이기지 않게 */
  .guide { position: fixed; inset: 0; z-index: 10; touch-action: none; }
  /* 종이 위에 덧댄 반투명 한 장. 가장자리가 종이 밖으로 살짝 걸치고
     오른쪽 아래 모서리가 접혀 있다 — 잡아서 치우면 된다는 표시. */
  .guide-sheet { position: absolute; pointer-events: none; overflow: visible; }
  .guide-sheet .film {
    fill: rgba(29, 43, 80, 0.075);         /* 잉크색을 옅게 — 종이가 비쳐 보인다 */
    stroke: rgba(29, 43, 80, 0.26); stroke-width: 1;
  }
  .guide-sheet .flap {
    fill: rgba(29, 43, 80, 0.19);          /* 접혀서 두 겹이 된 자리 */
    stroke: rgba(29, 43, 80, 0.26); stroke-width: 1;
  }
  .guide-hint {
    position: absolute;
    display: flex; gap: 5px;
    font-size: 10.5px; line-height: 1.45;
    color: var(--ink-faint);
    /* 필름이 덮인 종이색(#fff 위 잉크 7.5%)과 같게 — 설명 자리만 구멍처럼
       뚫려 보이지 않으면서 표본 글자와 겹쳐도 읽힌다. 필름 농도를 바꾸면 이 값도 같이 바꿀 것 */
    background: #eeeff2;
    word-break: keep-all;              /* 한글이 낱자로 끊기지 않게 */
    pointer-events: none;
  }
  .guide-hint i { font-style: normal; flex: none; }
  .guide-hint b { color: var(--ink); font-weight: 700; }
  .guide-hint.plain { font-size: 10px; }
  /* 가리키는 자리에 두르는 동그라미 — 안내에만 쓰는 표시 */
  .guide-ring {
    position: absolute;
    border: 1px solid var(--ink-faint); border-radius: 50%;
    pointer-events: none;
  }
  .guide-bar {
    position: absolute; left: 50%; transform: translateX(-50%);
    bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
    width: 100%; max-width: 560px;
    display: flex; align-items: baseline; justify-content: space-between; gap: 10px;
    padding: 6px calc(env(safe-area-inset-right, 0px) + 18px)
             6px calc(env(safe-area-inset-left, 0px) + 18px);
    background: var(--paper);
    border-top: 1px solid var(--rule);
  }
  .guide-bar button {
    border: none; background: none; font: inherit;
    font-size: 12px; font-weight: 700; color: var(--ink);
    padding: 5px 0; cursor: pointer; touch-action: none;
  }
  .guide-bar em { font-style: normal; font-size: 10px; color: var(--ink-faint); }

  /* ── 입력 ────────────────────────────────────────────────── */
  .entry {
    width: 100%;
    border: none; background: none; font: inherit;
    font-size: calc(var(--item-font) * var(--fs)); line-height: 1.45; color: var(--ink);
    padding: 3px 2px; min-height: calc(var(--item-height) * var(--fs));
    -webkit-user-select: text; user-select: text;
  }
  .entry:focus { outline: none; }
  /* 입력창 안에서는 커서를 찍을 수 있어야 한다 */
  input { touch-action: auto; }
</style>
</head>
<body>
<main>
  <header>
    <h1 id="weekTitle"></h1>
    <div class="nav">
      <button id="prev" type="button" aria-label="이전 주">‹</button>
      <button id="next" type="button" aria-label="다음 주">›</button>
    </div>
  </header>
  <p class="note-line" id="note" hidden></p>
  <div class="backup" id="backup" hidden>
    <button id="exportBtn" type="button">내보내기</button>
    <button id="importBtn" type="button">가져오기</button>
    <button id="guideBtn" type="button">쓰는 법</button>
    <span class="msg" id="backupMsg"></span>
  </div>
  <div class="week" id="weekBody"></div>
</main>
<input id="importFile" type="file" accept="application/json,.json" hidden>

<div class="guide" id="guide" hidden>
  <svg class="guide-sheet" id="guideSheet" aria-hidden="true">
    <path class="film"></path>
    <path class="flap"></path>
  </svg>
  <div id="guideHints"></div>
  <div class="guide-bar">
    <button id="guideNever" type="button">다시 보지 않기</button>
    <em>예시입니다 · 아무 데나 누르면 치워집니다</em>
  </div>
</div>

<script>
'use strict';

/* ═══════════════════════════════════════════════════════════════
   1. 획 파라미터 — 손맛 튜닝은 전부 여기서.
   ═══════════════════════════════════════════════════════════════ */
const STROKE = {
  /* ── 획 모양 (거의 직선 + 아주 미세한 손떨림) ────────────── */
  noiseAmplitude: 0.4,   // 획 흔들림 진폭 (px). 0이면 완전 직선
  noiseFrequency: 0.012, // 흔들림 주기 (1/px). 올리면 잘게 지글거림
  widthMin: 1.6,         // 최소 굵기 (px) — 빠르게 그을 때
  widthMax: 3.2,         // 최대 굵기 (px) — 천천히 그을 때
  taperLen: 8,           // 양끝이 얇아지는 구간 길이 (px)
  tiltMax: 0.015,        // 획 전체의 무작위 기울기 (dy/dx 최대값)
  followY: 0.15,         // 손가락 상하 움직임 반영 비율 (0=수평 고정)
  speedRef: 1.4,         // 이 속도(px/ms)에서 굵기가 widthMin까지 얇아짐
  widthNoise: 0.05,      // 굵기 자체의 미세 흔들림 비율
  widthNoiseFreq: 0.08,  // 굵기 흔들림 주기 (1/px)
  inkColor: '#26356b',   // 취소선 잉크색

  /* ── 판정 ────────────────────────────────────────────────── */
  commitRatio: 0.6,      // 확정 임계값 (해당 줄 폭 대비 통과 비율)
  slopPx: 8,             // 긋기 vs 스크롤 초기 방향 판정 이동량 (px)
  doubleTapMs: 260,      // 더블탭 판정 간격 (ms) — 탭 편집도 이만큼 기다림
  longPressMs: 500,      // 롱프레스 삭제 (ms)
  hapticOnCommit: true,  // 확정 시 진동 (iOS 사파리는 지원 안 함 → 무시됨)

  /* ── 더블탭 자동 긋기 ────────────────────────────────────── */
  overshoot: 2,          // 자동 획이 텍스트 밖으로 삐져나가는 양 (px)
  autoStrokeMs: 220,     // 자동 획 하나가 그어지는 시간 (ms)
  autoStagger: 70,       // 줄과 줄 사이 시차 (ms)

  /* ── 애니메이션 ──────────────────────────────────────────── */
  rewindMs: 200,         // 임계값 미달 시 선이 되감기는 시간 (ms)
  eraseFadeMs: 120,      // 다 지워진 획의 잔량이 사라지는 시간 (ms)
};

/* ── 지우개 ────────────────────────────────────────────────── */
const ERASE = {
  radius: 16,            // 지우개 반경 (px) — 문지른 자리 주변이 지워짐
  passStrength: 0.55,    // 한 번 지나갈 때 지워지는 정도 (0~1)
  doneThreshold: 0.85,   // 전 구간 누적이 이 값을 넘으면 완전히 지워짐
  bucketPx: 8,           // 지워짐 판정 구간 폭 (px)
  hapticOnErase: true,
};

/* ── 사각사각 소리 ─────────────────────────────────────────── */
const SOUND = {
  enabled: true,
  volume: 0.35,          // 최대 음량 (0~1)
  bandHz: 1900,          // 사각거림의 중심 주파수 (Hz). 낮추면 둔탁해짐
  bandQ: 0.9,            // 필터 폭. 올리면 더 '쉭' 하는 소리
  speedRef: 1.0,         // 이 속도(px/ms)에서 음량 최대
  floor: 0.25,           // 아주 느리게 그어도 유지되는 최소 음량 비율
  attackMs: 10,
  releaseMs: 80,
};

/* ═══════════════════════════════════════════════════════════════
   2. 유틸
   ═══════════════════════════════════════════════════════════════ */
const NS = 'http://www.w3.org/2000/svg';
const TAU = Math.PI * 2;
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
const easeOut = t => 1 - (1 - t) * (1 - t);
const easeIn = t => t * t;
let uidSeq = 0;
const newSeed = () => (Math.random() * 2147483647) | 0;

function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* 획 하나의 결(흔들림·기울기·굵기 요동)을 시드에서 만든다.
   같은 시드는 언제나 같은 획 → 저장은 시드만 하면 된다. */
function makeGrain(seed) {
  const rnd = mulberry32(seed);
  const p1 = rnd() * TAU, p2 = rnd() * TAU, p3 = rnd() * TAU;
  const tilt = (rnd() * 2 - 1) * STROKE.tiltMax;
  const f = STROKE.noiseFrequency * TAU;
  const fw = STROKE.widthNoiseFreq * TAU;
  return {
    tilt,
    noise: x => STROKE.noiseAmplitude *
      (0.7 * Math.sin(x * f + p1) + 0.3 * Math.sin(x * f * 2.3 + p2)),
    widthJitter: x => 1 + STROKE.widthNoise * Math.sin(x * fw + p3),
  };
}

/* 점 배열 → 굵기 변화가 있는 채움 패스(d).
   fraction < 1 이면 앞에서부터 그만큼만 그린다 (자라남 / 되감김). */
function buildPathD(points, fraction = 1) {
  const n = Math.max(0, Math.round(points.length * clamp(fraction, 0, 1)));
  if (n < 2) return '';
  const pts = points.slice(0, n);

  const dist = [0];
  for (let i = 1; i < pts.length; i++) {
    dist.push(dist[i - 1] + Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y));
  }
  const total = dist[dist.length - 1];
  if (total < 1) return '';

  const top = [], bot = [];
  for (let i = 0; i < pts.length; i++) {
    const p = pts[i];
    const taper = clamp(Math.min(dist[i], total - dist[i]) / STROKE.taperLen, 0, 1);
    const h = Math.max(0.3, p.w * (0.3 + 0.7 * Math.sqrt(taper))) / 2;
    top.push(p.x.toFixed(1) + ',' + (p.y - h).toFixed(1));
    bot.push(p.x.toFixed(1) + ',' + (p.y + h).toFixed(1));
  }
  bot.reverse();
  return 'M' + top.join('L') + 'L' + bot.join('L') + 'Z';
}

/* 세로획 — 굵기가 좌우로 벌어지는 채움 패스 */
function buildVPathD(points, fraction = 1) {
  const n = Math.max(0, Math.round(points.length * clamp(fraction, 0, 1)));
  if (n < 2) return '';
  const pts = points.slice(0, n);
  const total = Math.abs(pts[pts.length - 1].y - pts[0].y);
  if (total < 1) return '';

  const left = [], right = [];
  for (let i = 0; i < pts.length; i++) {
    const q = pts[i];
    const along = Math.abs(q.y - pts[0].y);
    const taper = clamp(Math.min(along, total - along) / STROKE.taperLen, 0, 1);
    const h = Math.max(0.3, q.w * (0.3 + 0.7 * Math.sqrt(taper))) / 2;
    left.push((q.x - h).toFixed(1) + ',' + q.y.toFixed(1));
    right.push((q.x + h).toFixed(1) + ',' + q.y.toFixed(1));
  }
  right.reverse();
  return 'M' + left.join('L') + 'L' + right.join('L') + 'Z';
}

/* 세로획의 점 배열 */
function makeVPoints(seed, x, y0, y1) {
  const g = makeGrain(seed);
  const mid = (STROKE.widthMin + STROKE.widthMax) / 2;
  const pts = [];
  for (let y = y0; y <= y1; y += 3) {
    pts.push({
      x: x + g.tilt * (y - y0) + g.noise(y),
      y,
      w: Math.max(0.5, mid * g.widthJitter(y)),
    });
  }
  return pts;
}

/* span이 차지한 줄(line box)들의 사각형 — 두 줄 이상 감김 대응 */
function lineRects(span) {
  const range = document.createRange();
  range.selectNodeContents(span);
  return Array.from(range.getClientRects()).filter(r => r.width > 1 && r.height > 1);
}

function lineIndexAt(rects, clientY) {
  let best = 0, bestDist = Infinity;
  for (let i = 0; i < rects.length; i++) {
    const r = rects[i];
    if (clientY >= r.top && clientY <= r.bottom) return i;
    const d = Math.min(Math.abs(clientY - r.top), Math.abs(clientY - r.bottom));
    if (d < bestDist) { bestDist = d; best = i; }
  }
  return best;
}

function haptic(on) {
  if (on && navigator.vibrate) navigator.vibrate(12);
}

/* ═══════════════════════════════════════════════════════════════
   3. 주 · 저장 — localStorage만 사용. 이월 없음, 마이그레이션 없음.
   ═══════════════════════════════════════════════════════════════ */
const STORE_PREFIX = 'clearweek:';
const DAY_KEYS = ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun', 'free'];
const WEEK_DAYS = DAY_KEYS.slice(0, 7);   /* 왼쪽 열에 세로로 쌓이는 요일 칸 */
/* 칸은 스스로 나뉜다 — 한 열에 안 들어가면 열이 늘어난다.
   세로선은 긋지도 그리지도 않는다. 표가 선으로 지저분해지지 않게.

   기준을 항목 수로 못 박지 않는 이유: 한 열에 들어가는 줄 수가 화면 높이에 따라
   다르다(작은 폰 3줄, 큰 폰 4줄). 숫자를 박으면 어떤 폰에서는 자리가 남는데
   나뉘고, 어떤 폰에서는 나뉘어도 잘린다. 실제로 넘치는지 보고 정한다. */
const AUTO_SPLIT = {
  maxColumns: 3,   // 한 칸을 최대 이만큼까지 나눈다
};

/* 열 수를 칸에 반영한다. 나눌수록 그 칸의 글씨가 작아진다. */
function applyColumns(section, bodyEl, cols) {
  section.dataset.splits = String(cols - 1);   /* 글씨 크기가 여기에 따라간다 */
  bodyEl.style.columnCount = String(cols);
}

/* 라벨을 꾹 눌러 아래로 끌면 요일 아래 메모를 적는다 */
const SUBLABEL = {
  pullDownPx: 14,      // 이만큼 아래로 끌면 메모 입력이 열린다
};
const DAY_INITIAL = ['M', 'T', 'W', 'T', 'F', 'S', 'S'];

/* 칸 라벨 — 요일 칸은 "20.T", 8번째 칸은 note */
function cellLabel(key, monday) {
  if (key === 'free') return 'note';
  const i = WEEK_DAYS.indexOf(key);
  const d = new Date(monday);
  d.setDate(d.getDate() + i);
  return d.getDate() + '.' + DAY_INITIAL[i];
}

function mondayOf(date) {
  const d = new Date(date);
  d.setHours(0, 0, 0, 0);
  d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
  return d;
}

function isoWeekId(monday) {
  const t = new Date(Date.UTC(monday.getFullYear(), monday.getMonth(), monday.getDate()));
  t.setUTCDate(t.getUTCDate() + 3);                 // 그 주의 목요일 = ISO 기준일
  const jan1 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
  const week = Math.ceil(((t - jan1) / 86400000 + 1) / 7);
  return t.getUTCFullYear() + '-W' + String(week).padStart(2, '0');
}

/* "2026. 8.17-8.23" — 연도는 맨 앞에 적히는 월요일 기준 */
function weekTitle(monday) {
  const end = new Date(monday);
  end.setDate(end.getDate() + 6);
  const fmt = d => (d.getMonth() + 1) + '.' + d.getDate();
  return monday.getFullYear() + '. ' + fmt(monday) + '-' + fmt(end);
}

function blankWeek(weekId) {
  const days = {}, notes = {};
  DAY_KEYS.forEach(k => { days[k] = []; notes[k] = ''; });
  return { weekId, days, notes };
}

/* 저장이 막혀 있으면(사파리 사생활 모드·용량 초과) 알려야 한다.
   조용히 실패하면 사용자는 다 적은 뒤에야 사라진 걸 안다. */
const Store = {
  blocked: false,       // 저장이 막힌 것이 확인된 상태
  onBlocked: null,      // 화면에 알리는 콜백 (App이 건다)
  fail() {
    if (this.blocked) return;
    this.blocked = true;
    if (this.onBlocked) this.onBlocked();
  },
  /* 시작할 때 한 번 — 적기도 전에 알 수 있다 */
  probe() {
    try {
      const k = STORE_PREFIX + '__probe';
      localStorage.setItem(k, '1');
      localStorage.removeItem(k);
    } catch (e) { this.fail(); }
  },
};

function loadWeek(weekId) {
  let raw = null;
  try { raw = localStorage.getItem(STORE_PREFIX + weekId); } catch (e) { Store.fail(); }
  if (!raw) return blankWeek(weekId);
  try {
    const w = JSON.parse(raw);
    const week = blankWeek(weekId);
    DAY_KEYS.forEach(k => {
      week.notes[k] = w.notes && typeof w.notes[k] === 'string' ? w.notes[k] : '';
      const list = w.days && Array.isArray(w.days[k]) ? w.days[k] : [];
      week.days[k] = list.map(it => ({
        id: it.id || String(++uidSeq),
        text: String(it.text || ''),
        struck: !!it.struck,
        createdAt: it.createdAt || 0,
        strikes: Array.isArray(it.strikes) ? it.strikes : [],
      }));
    });
    return week;
  } catch (e) {
    return blankWeek(weekId);
  }
}

function saveWeek(week) {
  try {
    localStorage.setItem(STORE_PREFIX + week.weekId, JSON.stringify(week));
    return true;
  } catch (e) {
    Store.fail();     // 화면은 그대로 동작하되, 저장이 안 된다는 것은 알린다
    return false;
  }
}

/* 안내를 다시 안 보기로 했는지. 주 데이터가 아니므로 백업에 담기지 않는다
   (백업은 `clearweek:YYYY-Www` 꼴 키만 모은다). */
const GUIDE_KEY = STORE_PREFIX + 'guide-seen';

function guideSeen() {
  try { return localStorage.getItem(GUIDE_KEY) === '1'; }
  catch (e) { return false; }        // 저장이 막혔으면 매번 보여 준다
}

/* 안내에 쓰는 표본 주 — 저장하지 않는다. 칸마다 한 가지씩만 보여 준다.
   한 칸에 두 마디를 붙이면 설명이 서로 겹친다. */
function guideSample(weekId) {
  const w = blankWeek(weekId);
  const mk = (text, struck) => ({
    id: 'guide-' + (++uidSeq), text, struck: !!struck, createdAt: 0,
    strikes: struck ? [{ line: 0, a: 0.01, b: 0.98, seed: 1074304443 }] : [],
  });
  w.days.tue = [mk('장보기')];
  w.days.wed = [mk('회의자료 정리', true)];
  w.days.thu = [mk('낭만백수달'), mk('영상편집')];
  w.days.free = [mk('영어 단어'), mk('책 반납')];
  return w;
}

/* at: [무엇, 어느 칸, 몇 번째 항목] */
const GUIDE_HINTS = [
  { at: ['label', 'mon'], ring: true,
    verb: '날짜를 누른다', tail: '그 줄에 바로 적힙니다. ＋ 버튼은 없습니다' },
  { at: ['item', 'tue', 0],
    verb: '글자 위를 옆으로 긋는다', tail: '다 한 일에 취소선' },
  { at: ['item', 'wed', 0],
    verb: '그은 자리를 문댄다', tail: '잘못 그었으면 문질러 벗겨냅니다' },
  { at: ['item', 'thu', 0],
    verb: '꾹 누른다', tail: '0.5초. 그 항목이 지워집니다' },
  { at: ['cell', 'fri'], plain: true,
    tail: '그은 것은 사라지지 않고 그 자리에 남습니다. 칸은 적은 만큼 저절로 나뉩니다.' },
];

function markGuideSeen() {
  try { localStorage.setItem(GUIDE_KEY, '1'); }
  catch (e) { Store.fail(); }        // 못 적었으면 그 사실을 알린다
}

/* ── 백업 — 서버가 없으므로 파일 하나가 전부다 ──────────────
   가져오기는 덮어쓰지 않는다. 지금 없는 주만 채운다.
   되돌리기가 없는 앱에서 덮어쓰기는 유일한 사본을 지울 수 있다. */
const BACKUP_KIND = 'clear-week-backup';
const WEEK_ID_RE = /^\d{4}-W\d{2}$/;

/* 주 하나가 깨져 있어도 나머지는 살려서 내보낸다.
   백업이 조용히 잘린 채 "성공"이라고 말하면 백업이 아니다. */
function collectWeeks() {
  const weeks = {};
  let broken = 0, n = 0;
  try { n = localStorage.length; }
  catch (e) { Store.fail(); return { weeks, broken }; }

  for (let i = 0; i < n; i++) {
    let key = null, raw = null;
    try {
      key = localStorage.key(i);
      if (!key || key.indexOf(STORE_PREFIX) !== 0) continue;
      raw = localStorage.getItem(key);
    } catch (e) { Store.fail(); continue; }     // 읽기가 막힌 것과
    const id = key.slice(STORE_PREFIX.length);
    if (!WEEK_ID_RE.test(id)) continue;
    try { weeks[id] = JSON.parse(raw); }
    catch (e) { broken++; }                      // 값이 깨진 것은 다르다
  }
  return { weeks, broken };
}

function backupFile() {
  const { weeks, broken } = collectWeeks();
  const body = JSON.stringify({
    kind: BACKUP_KIND, version: 1,
    savedAt: new Date().toISOString(),
    weeks,
  });
  /* 파일 이름은 화면에 적히는 날짜와 같아야 한다 — UTC가 아니라 이 자리의 날짜 */
  const d = new Date();
  const pad = v => String(v).padStart(2, '0');
  const name = 'clear-week-' + d.getFullYear() + '-' +
               pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + '.json';
  return { name, body, count: Object.keys(weeks).length, broken };
}

async function exportBackup() {
  const { name, body, count, broken } = backupFile();
  const done = count + '개 주 내보냄' + (broken ? ' · ' + broken + '개는 깨져서 빠짐' : '');

  /* 아이폰 사파리는 다운로드가 어정쩡해서 공유 시트를 먼저 쓴다 */
  if (typeof File === 'function' && navigator.canShare) {
    const file = new File([body], name, { type: 'application/json' });
    if (navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: name }); return done; }
      catch (e) { if (e && e.name === 'AbortError') return ''; }
    }
  }
  const url = URL.createObjectURL(new Blob([body], { type: 'application/json' }));
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  return done;
}

function importBackup(text) {
  let data;
  try { data = JSON.parse(text); } catch (e) { return { error: '읽을 수 없는 파일' }; }
  if (!data || data.kind !== BACKUP_KIND || !data.weeks || typeof data.weeks !== 'object') {
    return { error: 'Clear Week 백업 파일이 아님' };
  }
  let added = 0, kept = 0, broken = 0;
  const ids = Object.keys(data.weeks).filter(id => WEEK_ID_RE.test(id));
  for (const id of ids) {
    const w = data.weeks[id];
    /* 모양이 아닌 값을 넣으면 빈 주가 되고, 덮어쓰지 않는 규칙 때문에
       나중에 제대로 된 백업을 가져와도 그 자리가 막힌다 */
    if (!w || typeof w !== 'object' || !w.days || typeof w.days !== 'object') {
      broken++; continue;
    }
    const key = STORE_PREFIX + id;
    try {
      if (localStorage.getItem(key) !== null) { kept++; continue; }
      localStorage.setItem(key, JSON.stringify(w));
      added++;
    } catch (e) {
      Store.fail();
      return { error: '저장이 막혀 있어 가져올 수 없음' };
    }
  }
  if (!ids.length) return { error: '백업에 주가 없음' };
  return { added, kept, broken };
}

/* ═══════════════════════════════════════════════════════════════
   4. 사각사각 소리 — 필터를 통과시킨 노이즈의 음량을 손 속도로 조절
   ═══════════════════════════════════════════════════════════════ */
const Sound = {
  ctx: null, gain: null, filter: null,

  init() {
    if (this.ctx || !SOUND.enabled) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.ctx = new AC();

    const len = Math.floor(this.ctx.sampleRate * 2);
    const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    let brown = 0;
    for (let i = 0; i < len; i++) {
      const w = Math.random() * 2 - 1;
      brown = (brown + 0.02 * w) / 1.02;      // 종이 특유의 저역 성분
      d[i] = clamp(w * 0.75 + brown * 2.5, -1, 1);
    }

    const src = this.ctx.createBufferSource();
    src.buffer = buf;
    src.loop = true;

    this.filter = this.ctx.createBiquadFilter();
    this.filter.type = 'bandpass';
    this.filter.frequency.value = SOUND.bandHz;
    this.filter.Q.value = SOUND.bandQ;

    this.gain = this.ctx.createGain();
    this.gain.gain.value = 0;

    src.connect(this.filter);
    this.filter.connect(this.gain);
    this.gain.connect(this.ctx.destination);
    src.start();
  },

  resume() { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },

  /* speed: px/ms */
  scratch(speed) {
    if (!this.ctx || !SOUND.enabled) return;
    const s = clamp(speed / SOUND.speedRef, 0, 1);
    const level = (SOUND.floor + (1 - SOUND.floor) * s) * SOUND.volume;
    const now = this.ctx.currentTime;
    this.gain.gain.setTargetAtTime(level, now, SOUND.attackMs / 1000);
    this.filter.frequency.setTargetAtTime(SOUND.bandHz * (0.85 + 0.4 * s), now, 0.02);
  },

  silence() {
    if (!this.ctx) return;
    this.gain.gain.setTargetAtTime(0, this.ctx.currentTime, SOUND.releaseMs / 1000);
  },
};

/* ═══════════════════════════════════════════════════════════════
   5. 항목 하나 = StrikeItem
      줄마다 독립된 획. 그어진 줄은 지우개로 문대서 지운다.
      획은 시드 + 줄 안에서의 시작·끝 비율로만 저장된다.
   ═══════════════════════════════════════════════════════════════ */
class StrikeItem {
  constructor(data, host) {
    this.data = data;      // { id, text, struck, createdAt, strikes: [] }
    this.host = host;      // { save(), edit(item), remove(item) }

    this.el = document.createElement('div');
    this.el.className = 'item';
    this.el._strikeItem = this;        /* 드래그로 훑을 때 되찾기 위해 */

    this.textEl = document.createElement('span');
    this.textEl.className = 'item-text';
    this.textEl.textContent = data.text;

    this.svg = document.createElementNS(NS, 'svg');
    this.svg.setAttribute('class', 'strike-svg');
    this.defs = document.createElementNS(NS, 'defs');
    this.inkG = document.createElementNS(NS, 'g');
    this.svg.appendChild(this.defs);
    this.svg.appendChild(this.inkG);

    this.el.appendChild(this.textEl);
    this.el.appendChild(this.svg);

    this.status = 'idle';       // idle | drawing | animating
    this.strokes = [];
    this.pointer = null;
    this.lastTapAt = 0;
    this.tapTimer = null;

    this.el.addEventListener('pointerdown', e => this.onDown(e));
    this.el.addEventListener('pointermove', e => this.onMove(e));
    this.el.addEventListener('pointerup', e => this.onUp(e));
    this.el.addEventListener('pointercancel', () => this.onCancel());
    this.el.addEventListener('contextmenu', e => e.preventDefault());

  }

  /* 저장된 획 복원 — 레이아웃이 끝난 뒤에 불러야 한다 */
  restore() {
    if (!this.data.strikes.length) return;
    const rowRect = this.el.getBoundingClientRect();
    const rects = lineRects(this.textEl);
    if (!rects.length) return;

    for (const rec of this.data.strikes) {
      const r = rects[Math.min(rec.line, rects.length - 1)];
      if (!r) continue;
      const left = r.left - rowRect.left;
      const x0 = left + rec.a * r.width;
      const x1 = left + rec.b * r.width;
      const baseY = (r.top + r.bottom) / 2 - rowRect.top;
      const active = this.makePoints(rec.seed, x0, x1, baseY);
      active.el.setAttribute('d', buildPathD(active.points));
      this.registerStroke(active, rec.line, baseY, (r.bottom - r.top) / 2, rec);
    }
  }

  /* x0~x1 구간을 채우는 획 — 복원·자동 긋기 공용 */
  makePoints(seed, x0, x1, baseY, profiled) {
    const g = makeGrain(seed);
    const el = document.createElementNS(NS, 'path');
    el.setAttribute('fill', STROKE.inkColor);
    this.inkG.appendChild(el);

    const span = Math.max(1, x1 - x0);
    const mid = (STROKE.widthMin + STROKE.widthMax) / 2;
    const points = [];
    for (let x = x0; x <= x1; x += 3) {
      let w = mid;
      if (profiled) {
        const t = Math.pow(Math.sin(Math.PI * clamp((x - x0) / span, 0, 1)), 0.6);
        w = STROKE.widthMin * 1.1 + (STROKE.widthMax * 0.9 - STROKE.widthMin * 1.1) * t;
      }
      points.push({
        x,
        y: baseY + g.tilt * (x - x0) + g.noise(x),
        w: Math.max(0.5, w * g.widthJitter(x)),
      });
    }
    return { el, points };
  }

  /* 화면이 다시 짜였을 때(열 나누기·회전) 획을 지우고 복원하기 위해 */
  clearStrokes() {
    this.strokes.forEach(s => { s.el.remove(); if (s.mask) s.mask.remove(); });
    this.strokes = [];
  }

  strokeOnLine(i) { return this.strokes.find(s => s.lineIndex === i); }

  strokeAt(y) {
    let best = null, bd = Infinity;
    for (const s of this.strokes) {
      const d = Math.abs(y - s.cy);
      if (d < bd) { bd = d; best = s; }
    }
    return best && bd <= best.halfH + 14 ? best : null;
  }

  /* ── 제스처 ──────────────────────────────────────────────── */
  onDown(e) {
    if (this.status === 'animating' || this.pointer) return;
    Sound.init();
    Sound.resume();
    this.el.setPointerCapture(e.pointerId);
    this.pointer = {
      id: e.pointerId,
      rowRect: this.el.getBoundingClientRect(),
      rects: lineRects(this.textEl),
      startX: e.clientX, startY: e.clientY,
      lastX: e.clientX, lastY: e.clientY, lastT: e.timeStamp,
      moved: 0, speed: 0,
      mode: null,               // null | draw | erase | scroll
      active: null, grain: null, seed: 0,
      dirX: 0, trail: null, trailStroke: null, trailD: '', passTouched: null,
      longPress: setTimeout(() => {
        const p = this.pointer;
        if (!p) return;
        p.longPress = null;
        p.mode = 'purge';               // 여기서 떼면 이 항목만, 끌면 훑은 것 전부
        p.purge = new Set([this]);
        haptic(true);
        this.el.classList.add('purging');
      }, STROKE.longPressMs),
    };
  }

  onMove(e) {
    const p = this.pointer;
    if (!p || e.pointerId !== p.id) return;

    const stepX = e.clientX - p.lastX;
    const dt = Math.max(1, e.timeStamp - p.lastT);
    p.speed = p.speed * 0.75 + (Math.abs(stepX) / dt) * 0.25;

    const dx = e.clientX - p.startX;
    const dy = e.clientY - p.startY;
    p.moved = Math.max(p.moved, Math.hypot(dx, dy));
    if (p.longPress && p.moved > 10) { clearTimeout(p.longPress); p.longPress = null; }

    /* 꾹 누른 뒤 드래그 — 손가락이 지나간 항목을 전부 담는다 */
    if (p.mode === 'purge') {
      const under = document.elementFromPoint(e.clientX, e.clientY);
      const row = under && under.closest ? under.closest('.item') : null;
      const item = row && row._strikeItem;
      if (item && !p.purge.has(item)) {
        p.purge.add(item);
        item.el.classList.add('purging');
        haptic(true);
      }
      p.lastX = e.clientX; p.lastY = e.clientY; p.lastT = e.timeStamp;
      return;
    }

    if (!p.mode && Math.abs(dx) >= STROKE.slopPx) {
      if (Math.abs(dx) <= Math.abs(dy)) {
        p.mode = 'pass';                      // 세로 우세 → 셀의 열 나누기로
      } else {
        const line = lineIndexAt(p.rects, p.startY);
        if (this.strokeOnLine(line)) {
          p.mode = 'erase';
          p.passTouched = new Set();
        } else if (this.status === 'idle') {
          p.mode = 'draw';
          this.beginDraw(p, line);
        } else {
          p.mode = 'pass';
        }
      }
    }

    if (p.mode === 'draw') {
      this.addSample(p, e.clientX, e.clientY);
      Sound.scratch(p.speed);
    } else if (p.mode === 'erase') {
      this.trackErase(p, e.clientX - p.rowRect.left, e.clientY - p.rowRect.top, stepX);
      Sound.scratch(p.speed);
    }

    p.lastX = e.clientX; p.lastY = e.clientY; p.lastT = e.timeStamp;
  }

  onUp(e) {
    const p = this.pointer;
    if (!p || e.pointerId !== p.id) return;
    if (p.longPress) clearTimeout(p.longPress);
    this.pointer = null;
    Sound.silence();

    if (p.mode === 'purge') {
      const doomed = Array.from(p.purge);
      doomed.forEach(it => it.el.classList.remove('purging'));
      doomed.forEach(it => it.host.remove(it));
      return;
    }
    if (p.mode === 'draw') { this.finishDraw(p); return; }
    if (p.mode === 'erase' || p.mode === 'pass') return;

    if (p.moved >= 10) return;

    /* 탭 = 편집, 더블탭 = 남은 줄까지 자동으로 긋기 */
    const now = e.timeStamp;
    if (now - this.lastTapAt < STROKE.doubleTapMs) {
      clearTimeout(this.tapTimer);
      this.lastTapAt = 0;
      this.autoStrike();
    } else {
      this.lastTapAt = now;
      clearTimeout(this.tapTimer);
      this.tapTimer = setTimeout(() => {
        if (!this.data.struck) this.host.edit(this);
      }, STROKE.doubleTapMs);
    }
  }

  onCancel() {
    const p = this.pointer;
    if (!p) return;
    if (p.longPress) clearTimeout(p.longPress);
    this.pointer = null;
    Sound.silence();
    if (p.mode === 'purge') {
      p.purge.forEach(it => it.el.classList.remove('purging'));
    }
    if (p.mode === 'draw') this.rewind(p.active, () => { this.status = 'idle'; });
  }

  /* ── 긋기 ────────────────────────────────────────────────── */
  beginDraw(p, lineIdx) {
    this.status = 'drawing';
    p.seed = newSeed();
    p.grain = makeGrain(p.seed);
    p.lineIndex = lineIdx;
    const line = p.rects[lineIdx];

    p.lineLeft = line.left - p.rowRect.left;
    p.lineRight = line.right - p.rowRect.left;
    p.lineWidth = Math.max(1, line.width);
    p.baseY = (line.top + line.bottom) / 2 - p.rowRect.top;
    p.halfH = (line.bottom - line.top) / 2;
    p.originX = p.startX - p.rowRect.left;
    p.originY = p.startY;
    p.minX = Infinity; p.maxX = -Infinity;

    const el = document.createElementNS(NS, 'path');
    el.setAttribute('fill', STROKE.inkColor);
    el.setAttribute('fill-opacity', '0.88');   // 긋는 동안 살짝 옅게
    this.inkG.appendChild(el);
    p.active = { el, points: [] };
    this.addSample(p, p.startX, p.startY);
  }

  addSample(p, clientX, clientY) {
    const s = p.active;
    if (!s) return;
    const x = clientX - p.rowRect.left;
    const g = p.grain;
    const fingerDy = (clientY - p.originY) * STROKE.followY;
    const wBase = STROKE.widthMax -
      (STROKE.widthMax - STROKE.widthMin) * clamp(p.speed / STROKE.speedRef, 0, 1);

    const mk = px => ({
      x: px,
      y: p.baseY + fingerDy + g.tilt * (px - p.originX) + g.noise(px),
      w: Math.max(0.5, wBase * g.widthJitter(px)),
    });

    const last = s.points[s.points.length - 1];
    if (!last) {
      s.points.push(mk(x));
    } else {
      const gap = x - last.x;
      const steps = Math.max(1, Math.floor(Math.abs(gap) / 3));
      for (let i = 1; i <= steps; i++) s.points.push(mk(last.x + (gap * i) / steps));
    }
    p.minX = Math.min(p.minX, x);
    p.maxX = Math.max(p.maxX, x);
    s.el.setAttribute('d', buildPathD(s.points));
  }

  finishDraw(p) {
    const covered = Math.max(0,
      Math.min(p.maxX, p.lineRight) - Math.max(p.minX, p.lineLeft));
    if (covered / p.lineWidth >= STROKE.commitRatio) this.commitLine(p);
    else this.rewind(p.active, () => { this.status = 'idle'; });
  }

  /* 확정 — 손이 지나간 만큼만, 그 줄에만 남는다 */
  commitLine(p) {
    p.active.el.setAttribute('fill-opacity', '1');
    haptic(STROKE.hapticOnCommit);
    const rec = {
      line: p.lineIndex,
      a: (p.minX - p.lineLeft) / p.lineWidth,
      b: (p.maxX - p.lineLeft) / p.lineWidth,
      seed: p.seed,
    };
    this.data.strikes.push(rec);
    this.registerStroke(p.active, p.lineIndex, p.baseY, p.halfH, rec);
    this.status = 'idle';
    this.syncStruck();
    this.settle();
  }

  registerStroke(active, lineIndex, cy, halfH, rec) {
    let minX = Infinity, maxX = -Infinity;
    for (const pt of active.points) {
      if (pt.x < minX) minX = pt.x;
      if (pt.x > maxX) maxX = pt.x;
    }
    this.strokes.push({
      uid: ++uidSeq, rec,
      el: active.el, points: active.points,
      lineIndex, cy, halfH, minX, maxX,
      mask: null, buckets: null,
    });
  }

  syncStruck() {
    this.data.struck = this.data.strikes.length > 0;
    this.host.save();
  }

  settle() {
    this.el.classList.remove('pulse');
    void this.el.offsetWidth;
    this.el.classList.add('pulse');
  }

  rewind(active, done) {
    if (!active) { if (done) done(); return; }
    this.status = 'animating';
    const t0 = performance.now();
    const step = now => {
      const t = clamp((now - t0) / STROKE.rewindMs, 0, 1);
      active.el.setAttribute('d', buildPathD(active.points, 1 - easeIn(t)));
      if (t < 1) requestAnimationFrame(step);
      else { active.el.remove(); if (done) done(); }
    };
    requestAnimationFrame(step);
  }

  /* ── 더블탭: 아직 안 그어진 줄을 전부 자동으로 긋기 ──────── */
  autoStrike() {
    if (this.status !== 'idle') return;
    const rowRect = this.el.getBoundingClientRect();
    const rects = lineRects(this.textEl);
    const targets = [];
    rects.forEach((r, i) => { if (!this.strokeOnLine(i)) targets.push([r, i]); });
    if (!targets.length) return;

    this.status = 'animating';
    const made = targets.map(([r, i]) => {
      const seed = newSeed();
      const x0 = r.left - rowRect.left - STROKE.overshoot;
      const x1 = r.right - rowRect.left + STROKE.overshoot;
      const baseY = (r.top + r.bottom) / 2 - rowRect.top;
      const active = this.makePoints(seed, x0, x1, baseY, true);
      const left = r.left - rowRect.left;
      return {
        active, lineIndex: i, cy: baseY, halfH: (r.bottom - r.top) / 2,
        rec: { line: i, a: (x0 - left) / r.width, b: (x1 - left) / r.width, seed },
      };
    });

    const total = STROKE.autoStrokeMs + STROKE.autoStagger * (made.length - 1);
    Sound.init(); Sound.resume(); Sound.scratch(0.5);
    const t0 = performance.now();
    const step = now => {
      const ms = clamp(now - t0, 0, total);
      made.forEach((m, i) => {
        const local = clamp((ms - i * STROKE.autoStagger) / STROKE.autoStrokeMs, 0, 1);
        m.active.el.setAttribute('d', buildPathD(m.active.points, easeOut(local)));
      });
      if (ms < total) requestAnimationFrame(step);
      else {
        Sound.silence();
        haptic(STROKE.hapticOnCommit);
        made.forEach(m => {
          this.data.strikes.push(m.rec);
          this.registerStroke(m.active, m.lineIndex, m.cy, m.halfH, m.rec);
        });
        this.status = 'idle';
        this.syncStruck();
        this.settle();
      }
    };
    requestAnimationFrame(step);
  }

  /* ── 지우개: 문지른 자리만 잉크가 벗겨진다 ───────────────── */
  ensureErasable(s) {
    if (s.mask) return;
    const id = 'cw-mask-' + s.uid;
    const mask = document.createElementNS(NS, 'mask');
    mask.setAttribute('id', id);
    mask.setAttribute('maskUnits', 'userSpaceOnUse');
    mask.setAttribute('x', '-500'); mask.setAttribute('y', '-500');
    mask.setAttribute('width', '3000'); mask.setAttribute('height', '3000');
    const rect = document.createElementNS(NS, 'rect');
    rect.setAttribute('x', '-500'); rect.setAttribute('y', '-500');
    rect.setAttribute('width', '3000'); rect.setAttribute('height', '3000');
    rect.setAttribute('fill', '#fff');
    mask.appendChild(rect);
    this.defs.appendChild(mask);
    s.mask = mask;
    s.el.setAttribute('mask', 'url(#' + id + ')');
    s.buckets = new Float32Array(
      Math.max(1, Math.ceil((s.maxX - s.minX) / ERASE.bucketPx)));
  }

  newTrail(s) {
    const t = document.createElementNS(NS, 'path');
    t.setAttribute('fill', 'none');
    t.setAttribute('stroke', '#000');
    t.setAttribute('stroke-opacity', String(ERASE.passStrength));
    t.setAttribute('stroke-width', String(ERASE.radius * 2));
    t.setAttribute('stroke-linecap', 'round');
    t.setAttribute('stroke-linejoin', 'round');
    s.mask.appendChild(t);
    return t;
  }

  trackErase(p, x, y, stepX) {
    /* 좌우 방향이 바뀌면 새 패스 — 같은 자리를 오갈수록 더 지워진다 */
    if (stepX !== 0) {
      const dir = stepX > 0 ? 1 : -1;
      if (dir !== p.dirX) {
        p.dirX = dir;
        p.trail = null;
        p.passTouched = new Set();
      }
    }

    const s = this.strokeAt(y);
    if (!s) { p.trail = null; p.trailStroke = null; return; }
    this.ensureErasable(s);

    if (!p.trail || p.trailStroke !== s) {
      p.trail = this.newTrail(s);
      p.trailStroke = s;
      p.trailD = 'M' + x.toFixed(1) + ' ' + y.toFixed(1);
    } else {
      p.trailD += 'L' + x.toFixed(1) + ' ' + y.toFixed(1);
    }
    p.trail.setAttribute('d', p.trailD);

    const i0 = clamp(Math.floor((x - ERASE.radius - s.minX) / ERASE.bucketPx),
                     0, s.buckets.length - 1);
    const i1 = clamp(Math.floor((x + ERASE.radius - s.minX) / ERASE.bucketPx),
                     0, s.buckets.length - 1);
    for (let i = i0; i <= i1; i++) {
      const key = s.uid + ':' + i;
      if (!p.passTouched.has(key)) {
        p.passTouched.add(key);
        s.buckets[i] += ERASE.passStrength;
      }
    }

    for (let i = 0; i < s.buckets.length; i++) {
      if (s.buckets[i] < ERASE.doneThreshold) return;
    }
    p.trail = null; p.trailStroke = null;
    this.removeStroke(s);
  }

  removeStroke(s) {
    haptic(ERASE.hapticOnErase);
    const i = this.strokes.indexOf(s);
    if (i >= 0) this.strokes.splice(i, 1);
    const j = this.data.strikes.indexOf(s.rec);
    if (j >= 0) this.data.strikes.splice(j, 1);
    this.syncStruck();

    const t0 = performance.now();
    const step = now => {
      const t = clamp((now - t0) / STROKE.eraseFadeMs, 0, 1);
      s.el.setAttribute('opacity', String(1 - t));
      if (t < 1) requestAnimationFrame(step);
      else { s.el.remove(); if (s.mask) s.mask.remove(); }
    };
    requestAnimationFrame(step);
  }
}

/* ═══════════════════════════════════════════════════════════════
   7. 화면 — 왼쪽 7칸 + 오른쪽 note. 한 주가 한 화면에 고정.
   ═══════════════════════════════════════════════════════════════ */
const App = {
  monday: null,
  week: null,
  guideOn: false,

  init() {
    Store.onBlocked = () => this.updateNote();
    Store.probe();                                 // 적기 전에 미리 알아낸다
    this.thisMonday = mondayOf(new Date());
    this.go(this.thisMonday);
    document.getElementById('prev').addEventListener('click', () => this.shift(-7));
    document.getElementById('next').addEventListener('click', () => this.shift(7));
    this.bindBackup();
    this.bindGuide();
    if (!guideSeen()) this.openGuide();

    /* 화면 크기가 바뀌면 열 경계와 획을 다시 맞춘다 */
    let resizeTimer = null;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        this.relayoutAll();
        if (this.guideOn) { this.layoutGuideSheet(); this.layoutGuideHints(); }
      }, 120);
    });
  },

  /* 스크롤이 없으므로, 키보드가 올라오면 화면을 그만큼만 밀어 올린다 */
  keepVisible(el) {
    const vv = window.visualViewport;
    if (!vv) return () => {};
    const adjust = () => {
      const r = el.getBoundingClientRect();
      const over = r.bottom + 12 - (vv.height + vv.offsetTop);
      document.documentElement.style.setProperty(
        '--kb-shift', over > 0 ? (-over) + 'px' : '0px');
    };
    adjust();
    vv.addEventListener('resize', adjust);
    vv.addEventListener('scroll', adjust);
    return () => {
      vv.removeEventListener('resize', adjust);
      vv.removeEventListener('scroll', adjust);
      document.documentElement.style.setProperty('--kb-shift', '0px');
    };
  },

  shift(days) {
    const d = new Date(this.monday);
    d.setDate(d.getDate() + days);
    this.go(d);
  },

  go(monday) {
    this.monday = monday;
    this.week = loadWeek(isoWeekId(monday));
    this.render();
  },

  save() { if (!this.guideOn) saveWeek(this.week); },

  /* 머리말 아래 한 줄 — 지금은 저장이 막혔다는 알림에만 쓴다 */
  updateNote() {
    const note = document.getElementById('note');
    const msg = Store.blocked ? '저장 안 됨 — 사생활 모드이거나 용량이 찼습니다' : '';
    note.hidden = !msg;
    note.textContent = msg;
    note.classList.toggle('warn', !!msg);
  },

  render() {
    document.getElementById('weekTitle').textContent = weekTitle(this.monday);
    this.updateNote();

    const body = document.getElementById('weekBody');
    body.innerHTML = '';
    this.cells = {};

    const daysCol = document.createElement('div');
    daysCol.className = 'days';
    const freeCol = document.createElement('div');
    freeCol.className = 'free';
    body.appendChild(daysCol);
    body.appendChild(freeCol);

    WEEK_DAYS.forEach(key => daysCol.appendChild(this.buildCell(key)));
    freeCol.appendChild(this.buildCell('free'));

    /* 레이아웃이 잡힌 뒤에 열 수와 저장된 획을 반영한다 */
    requestAnimationFrame(() => this.relayoutAll());
  },

  buildCell(key) {
    const section = document.createElement('section');
    section.className = key === 'free' ? 'cell free-cell' : 'cell day';

    const listEl = document.createElement('div');
    listEl.className = 'cell-body';

    /* 왼쪽 여백 = 요일 라벨 + 그 아래 작은 메모 */
    const gutter = document.createElement('div');
    gutter.className = 'cell-gutter';

    const label = document.createElement('button');
    label.type = 'button';
    label.className = 'cell-label';
    label.textContent = cellLabel(key, this.monday);

    const sub = document.createElement('div');
    sub.className = 'sublabel';
    sub.textContent = this.week.notes[key] || '';

    gutter.appendChild(label);
    gutter.appendChild(sub);
    section.appendChild(gutter);
    section.appendChild(listEl);

    {
      /* 살짝 누르면 항목 추가, 꾹 눌러 아래로 끌면 요일 아래 메모 */
      let g = null;
      label.addEventListener('pointerdown', e => {
        label.setPointerCapture(e.pointerId);
        g = { id: e.pointerId, x: e.clientX, y: e.clientY, pulled: false };
      });
      label.addEventListener('pointermove', e => {
        if (!g || e.pointerId !== g.id || g.pulled) return;
        if (e.clientY - g.y >= SUBLABEL.pullDownPx &&
            e.clientY - g.y > Math.abs(e.clientX - g.x)) {
          g.pulled = true;
          haptic(true);
          this.openSublabel(key, gutter, sub);
        }
      });
      label.addEventListener('pointerup', e => {
        if (!g || e.pointerId !== g.id) return;
        const moved = Math.hypot(e.clientX - g.x, e.clientY - g.y);
        const pulled = g.pulled;
        g = null;
        if (!pulled && moved < 10) this.openEntry(key, listEl);
      });
      label.addEventListener('pointercancel', () => { g = null; });

      sub.addEventListener('click', () => this.openSublabel(key, gutter, sub));
    }

    const items = this.week.days[key].map(data => {
      const item = this.makeItem(data, key, listEl);
      listEl.appendChild(item.el);
      return item;
    });

    this.cells[key] = { section, listEl, items, sub, mark: null };
    return section;
  },

  makeItem(data, dayKey, listEl) {
    return new StrikeItem(data, {
      save: () => this.save(),
      edit: item => this.editItem(item, dayKey, listEl),
      remove: item => this.removeItem(item, dayKey),
    });
  },

  relayoutCell(key) {
    const cell = this.cells[key];
    if (!cell) return;
    cell.listEl.scrollLeft = 0;      // 입력 중 밀려 있던 가로 위치를 되돌린다
    cell.listEl.scrollTop = 0;
    this.fitColumns(key);
    cell.items.forEach(item => { item.clearStrokes(); item.restore(); });
    this.updateOverflow(key);
  },

  /* 한 열에 다 들어가면 한 열로 둔다. 넘치면 하나 늘려 다시 재 본다.
     note 칸은 화면 높이 전체라 한 열로 충분하므로 나누지 않는다. */
  fitColumns(key) {
    const cell = this.cells[key];
    const max = key === 'free' ? 1 : AUTO_SPLIT.maxColumns;
    for (let cols = 1; cols < max; cols++) {
      applyColumns(cell.section, cell.listEl, cols);
      if (this.hiddenCount(cell) === 0) return cols;
    }
    applyColumns(cell.section, cell.listEl, max);
    return max;
  },

  /* 항목이 늘거나 줄면 열 수가 바뀔 수 있다. 바뀌면 글씨 크기도 바뀌므로
     그 칸의 획을 다시 그린다. */
  refreshCell(key) {
    const cell = this.cells[key];
    if (!cell) return;
    const before = cell.listEl.style.columnCount;
    this.fitColumns(key);
    if (cell.listEl.style.columnCount !== before) {
      cell.items.forEach(item => { item.clearStrokes(); item.restore(); });
    }
    this.updateOverflow(key);
  },

  relayoutAll() { Object.keys(this.cells).forEach(k => this.relayoutCell(k)); },

  /* ── 넘친 항목 — 데이터엔 있는데 칸 밖이라 안 보이는 것들 ──
     한 주가 한 화면이라 칸 높이가 고정이고, 넘치면 잘린다.
     잘렸다는 사실만 알린다. 숨기거나 줄이지 않는다 — 칸을 나누면 사라진다. */
  hiddenCount(cell) {
    const box = cell.listEl.getBoundingClientRect();
    if (box.height < 1) return 0;
    let n = 0;
    cell.items.forEach(item => {
      if (item.el.hidden) return;
      const r = item.el.getBoundingClientRect();
      if (r.width < 1 && r.height < 1) { n++; return; }   // 아예 배치되지 못함
      if (r.bottom > box.bottom + 1 || r.right > box.right + 1) n++;
    });
    return n;
  },

  updateOverflow(key) {
    const cell = this.cells[key];
    if (!cell) return;
    const n = this.hiddenCount(cell);
    if (!n) {
      if (cell.mark) { cell.mark.remove(); cell.mark = null; }
      return;
    }
    if (!cell.mark) {
      cell.mark = document.createElement('div');
      cell.mark.className = 'overflow-mark';
      cell.section.appendChild(cell.mark);
    }
    cell.mark.textContent = '+' + n;
  },

  /* ── 백업 — 제목을 0.5초 꾹 누르면 한 줄이 열린다 ─────────
     설정 화면은 두지 않는다. 평소에는 없는 것과 같아야 한다. */
  bindBackup() {
    const bar = document.getElementById('backup');
    const title = document.getElementById('weekTitle');
    let timer = null;

    title.addEventListener('pointerdown', () => {
      clearTimeout(timer);
      timer = setTimeout(() => { timer = null; haptic(true); this.toggleBackup(); },
                         STROKE.longPressMs);
    });
    ['pointerup', 'pointercancel', 'pointerleave'].forEach(t =>
      title.addEventListener(t, () => { clearTimeout(timer); timer = null; }));

    document.getElementById('exportBtn').addEventListener('click', async () => {
      this.backupMsg('내보내는 중…');
      try { this.backupMsg(await exportBackup()); }
      catch (e) { this.backupMsg('내보내지 못함'); }
    });

    const file = document.getElementById('importFile');
    document.getElementById('importBtn').addEventListener('click', () => {
      file.value = '';
      file.click();
    });
    file.addEventListener('change', () => {
      const f = file.files && file.files[0];
      if (!f) return;
      const reader = new FileReader();
      reader.onload = () => {
        const r = importBackup(String(reader.result));
        if (r.error) { this.backupMsg(r.error); return; }
        this.go(this.monday);         // 지금 보는 주가 채워졌을 수 있다
        this.backupMsg(r.added + '개 주 가져옴' +
          (r.kept ? ' · ' + r.kept + '개는 이미 있어 그대로 둠' : ''));
      };
      reader.onerror = () => this.backupMsg('파일을 읽지 못함');
      reader.readAsText(f);
    });

    /* 열려 있는 동안 딴 데를 누르면 닫힌다.
       캡처 단계에서 닫아야 한다 — 항목이 pointerdown에서 자기 위치를 재는데,
       그 뒤에 줄이 닫히면 화면이 밀려 방금 잰 값이 어긋난다. */
    this.closeBackupOutside = e => {
      if (bar.contains(e.target) || e.target === title) return;
      this.toggleBackup(false);
    };
  },

  toggleBackup(force) {
    const bar = document.getElementById('backup');
    const open = force === undefined ? bar.hidden : force;
    if (open === !bar.hidden) return;
    bar.hidden = !open;
    this.backupMsg('');
    const opts = { capture: true };
    if (open) setTimeout(() => document.addEventListener('pointerdown', this.closeBackupOutside, opts), 0);
    else document.removeEventListener('pointerdown', this.closeBackupOutside, opts);
    /* 줄이 하나 늘고 줄면 칸 높이가 바뀐다 — 획을 그 자리에서 다시 맞춘다.
       다음 프레임으로 미루면 그 사이에 시작된 긋기가 지워진다. */
    this.relayoutAll();
  },

  backupMsg(text) { document.getElementById('backupMsg').textContent = text || ''; },

  /* ── 첫 실행 안내 — 버튼이 하나도 없는 화면이라 첫 단서는 필요하다 ──
     아무 데나 누르면 이번만 닫히고, 다시 보지 않기를 누르면 영영 안 뜬다. */
  bindGuide() {
    const g = document.getElementById('guide');
    g.addEventListener('pointerdown', e => {
      if (e.target.closest('#guideNever')) return;   // 버튼은 자기 일을 하게 둔다
      this.closeGuide();
    });
    document.getElementById('guideNever').addEventListener('click', () => {
      markGuideSeen();
      this.closeGuide();
    });
    document.getElementById('guideBtn').addEventListener('click', () => {
      this.toggleBackup(false);
      this.openGuide();
    });
  },

  /* 표본 주로 바꿔 그린 뒤 그 위에 설명을 얹는다. 닫으면 원래 주로 돌아온다.
     표본은 저장하지 않는다 — save()가 guideOn 동안 아무것도 하지 않는다. */
  openGuide() {
    if (this.guideOn) return;
    this.guideOn = true;
    this.realWeek = this.week;
    this.week = guideSample(this.week.weekId);
    this.render();
    document.getElementById('guide').hidden = false;
    requestAnimationFrame(() => { this.layoutGuideSheet(); this.layoutGuideHints(); });
  },

  closeGuide() {
    if (!this.guideOn) return;
    document.getElementById('guide').hidden = true;
    document.getElementById('guideHints').innerHTML = '';
    this.guideOn = false;
    this.week = this.realWeek;
    this.realWeek = null;
    this.render();
  },

  guideAnchor(at) {
    const cell = this.cells[at[1]];
    if (!cell) return null;
    if (at[0] === 'label') return cell.section.querySelector('.cell-label');
    if (at[0] === 'item') return cell.items[at[2]] ? cell.items[at[2]].textEl : null;
    return cell.listEl;
  },

  /* 셀로판지 한 장 — 주간 표보다 조금 크게 덮어 덧댄 장으로 보이게 하고,
     오른쪽 아래 모서리를 접어 치울 수 있음을 알린다. */
  layoutGuideSheet() {
    const svg = document.getElementById('guideSheet');
    const body = document.getElementById('weekBody');
    const bar = document.querySelector('.guide-bar');
    if (!svg || !body) return;

    const b = body.getBoundingClientRect();
    const over = 6;      // 종이 밖으로 걸치는 정도 (px)
    const fold = 24;     // 접힌 모서리 크기 (px)
    const left = b.left - over;
    const top = b.top - over;
    const w = Math.max(60, (b.right + over) - left);
    const h = Math.max(60, (bar ? bar.getBoundingClientRect().top - 10 : b.bottom) - top);

    svg.style.left = Math.round(left) + 'px';
    svg.style.top = Math.round(top) + 'px';
    svg.style.width = Math.round(w) + 'px';
    svg.style.height = Math.round(h) + 'px';
    svg.setAttribute('viewBox', '0 0 ' + Math.round(w) + ' ' + Math.round(h));

    const x1 = (w - 0.5).toFixed(1), y1 = (h - 0.5).toFixed(1);
    const xf = (w - 0.5 - fold).toFixed(1), yf = (h - 0.5 - fold).toFixed(1);
    svg.querySelector('.film').setAttribute('d',
      'M0.5,0.5 H' + x1 + ' V' + yf + ' L' + xf + ',' + y1 + ' H0.5 Z');
    svg.querySelector('.flap').setAttribute('d',
      'M' + xf + ',' + y1 + ' L' + x1 + ',' + yf + ' L' + x1 + ',' + y1 + ' Z');
  },

  /* 설명은 가리키는 것의 오른쪽에 놓고, 요일 열 안에서 끝낸다 */
  layoutGuideHints() {
    const wrap = document.getElementById('guideHints');
    wrap.innerHTML = '';
    const daysEl = document.querySelector('.days');
    if (!daysEl) return;
    const daysRight = daysEl.getBoundingClientRect().right;

    GUIDE_HINTS.forEach(h => {
      const anchor = this.guideAnchor(h.at);
      if (!anchor) return;
      const r = anchor.getBoundingClientRect();
      let left = h.plain ? r.left : r.right + 10;
      let top = h.plain ? r.top + 6 : r.top - 2;
      let width = daysRight - left - 6;
      /* 오른쪽에 자리가 없으면(좁은 화면) 그 아랫줄로 내린다.
         요일 열 밖으로 삐져나가면 note 칸 글자와 겹친다. */
      if (!h.plain && width < 104) {
        left = r.left;
        top = r.bottom + 2;
        width = daysRight - left - 6;
      }

      const el = document.createElement('div');
      el.className = 'guide-hint' + (h.plain ? ' plain' : '');
      el.style.left = Math.round(left) + 'px';
      el.style.top = Math.round(top) + 'px';
      el.style.width = Math.round(Math.max(60, width)) + 'px';
      if (h.plain) {
        el.appendChild(document.createElement('span')).textContent = h.tail;
      } else {
        el.appendChild(document.createElement('i')).textContent = '←';
        const span = el.appendChild(document.createElement('span'));
        span.appendChild(document.createElement('b')).textContent = h.verb;
        span.appendChild(document.createTextNode(' — ' + h.tail));
      }
      wrap.appendChild(el);

      if (h.ring) {
        const ring = wrap.appendChild(document.createElement('div'));
        ring.className = 'guide-ring';
        ring.style.left = Math.round(r.left - 6) + 'px';
        ring.style.top = Math.round(r.top - 3) + 'px';
        ring.style.width = Math.round(r.width + 12) + 'px';
        ring.style.height = Math.round(r.height + 6) + 'px';
      }
    });
  },

  /* ── 적기: 인라인 입력, 엔터로 연속 입력 ─────────────────── */
  openEntry(dayKey, listEl) {
    const open = listEl.querySelector('.entry');
    if (open) { open.focus(); return; }

    const input = document.createElement('input');
    input.className = 'entry';
    input.type = 'text';
    input.setAttribute('autocomplete', 'off');
    input.setAttribute('autocapitalize', 'sentences');
    input.setAttribute('enterkeyhint', 'enter');

    let closed = false;
    const release = this.keepVisible(input);
    const close = () => {
      if (closed) return;
      closed = true;
      release();
      input.remove();
      listEl.scrollLeft = 0;         // 넘친 항목은 칸을 나눠야 보인다
      listEl.scrollTop = 0;
      this.refreshCell(dayKey);
    };

    /* 적힌 것이 있으면 항목으로 확정한다. 엔터로도, 딴 데를 눌러도 같다. */
    const commitText = () => {
      const text = input.value.trim();
      if (!text) return false;

      const data = {
        id: String(++uidSeq) + '-' + Date.now(),
        text, struck: false, createdAt: Date.now(), strikes: [],
      };
      this.week.days[dayKey].push(data);
      this.save();

      const item = this.makeItem(data, dayKey, listEl);
      listEl.insertBefore(item.el, input);    // 입력창은 늘 목록 맨 아래
      if (this.cells[dayKey]) this.cells[dayKey].items.push(item);
      item.restore();
      this.refreshCell(dayKey);               // 항목이 늘면 열이 늘고, 남으면 잘렸다고 표시된다
      input.value = '';                       // 다음 줄 입력창이 바로 이어짐
      return true;
    };

    input.addEventListener('keydown', e => {
      if (e.key !== 'Enter') return;
      e.preventDefault();
      if (!commitText()) { close(); input.blur(); }   // 빈 채로 엔터 = 종료
    });
    input.addEventListener('blur', () => { commitText(); close(); });

    listEl.appendChild(input);
    input.focus();
  },

  /* ── 요일 아래 메모 — 6.5pt 세미볼드 ─────────────────────── */
  openSublabel(key, gutter, sub) {
    if (gutter.querySelector('.sublabel-entry')) return;

    const input = document.createElement('input');
    input.className = 'sublabel-entry';
    input.type = 'text';
    input.value = this.week.notes[key] || '';
    input.setAttribute('enterkeyhint', 'done');

    let closed = false;
    const release = this.keepVisible(input);
    const commit = () => {
      if (closed) return;
      closed = true;
      release();
      const text = input.value.trim();
      input.remove();
      this.week.notes[key] = text;
      sub.textContent = text;
      sub.hidden = false;
      this.save();
      this.updateOverflow(key);      // 메모가 한 줄 차지하면 항목이 밀린다
    };
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); input.blur(); }
    });
    input.addEventListener('blur', commit);

    sub.hidden = true;
    gutter.appendChild(input);
    input.focus();
    input.setSelectionRange(input.value.length, input.value.length);
  },

  /* ── 편집: 그어진 항목은 편집 불가 ───────────────────────── */
  editItem(item, dayKey, listEl) {
    if (item.data.struck) return;
    const input = document.createElement('input');
    input.className = 'entry';
    input.type = 'text';
    input.value = item.data.text;
    input.setAttribute('enterkeyhint', 'done');

    let closed = false;
    const release = this.keepVisible(input);
    const commit = () => {
      if (closed) return;
      closed = true;
      release();
      const text = input.value.trim();
      input.remove();
      if (!text) { this.removeItem(item, dayKey); return; }
      item.data.text = text;
      item.textEl.textContent = text;
      this.save();
      item.el.hidden = false;                 // 제자리에 그대로 둔다
      this.refreshCell(dayKey);
    };

    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); input.blur(); }
    });
    input.addEventListener('blur', commit);

    item.el.hidden = true;
    listEl.insertBefore(input, item.el);
    input.focus();
    input.setSelectionRange(input.value.length, input.value.length);
  },

  /* ── 삭제: 롱프레스. 확인 다이얼로그 없음 ────────────────── */
  removeItem(item, dayKey) {
    const list = this.week.days[dayKey];
    const i = list.indexOf(item.data);
    if (i >= 0) list.splice(i, 1);
    this.save();
    item.el.remove();
    const cell = this.cells[dayKey];
    if (cell) {
      const j = cell.items.indexOf(item);
      if (j >= 0) cell.items.splice(j, 1);
      this.refreshCell(dayKey);
    }
  },
};

/* ═══════════════════════════════════════════════════════════════
   8. 확대 차단 — iOS 사파리는 user-scalable=no를 무시하므로 직접 막는다
   ═══════════════════════════════════════════════════════════════ */
['gesturestart', 'gesturechange', 'gestureend'].forEach(type => {
  document.addEventListener(type, e => e.preventDefault(), { passive: false });
});
document.addEventListener('touchmove', e => {
  if (e.touches.length > 1) e.preventDefault();   /* 두 손가락 = 확대 시도 */
}, { passive: false });

App.init();
</script>
</body>
</html>
