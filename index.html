  rubAt(p, clientX, clientY) {
    let r = p.rubs.get(this);
    if (!r) { r = { trail: null, stroke: null, d: '' }; p.rubs.set(this, r); }

    const rect = this.el.getBoundingClientRect();
    const x = clientX - rect.left, y = clientY - rect.top;

    const s = this.strokeAt(y);
    if (!s) { r.trail = null; r.stroke = null; return; }
    this.ensureErasable(s);

    if (!r.trail || r.stroke !== s) {
      r.trail = this.newTrail(s);
      r.stroke = s;
      r.d = 'M' + x.toFixed(1) + ' ' + y.toFixed(1);
    } else {
      r.d += 'L' + x.toFixed(1) + ' ' + y.toFixed(1);
    }
    r.trail.setAttribute('d', r.d);

    const i0 = clamp(Math.floor((x - ERASE.radius - s.minX) / ERASE.bucketPx),
                     0, s.buckets.length - 1);
    const i1 = clamp(Math.floor((x + ERASE.radius - s.minX) / ERASE.bucketPx),
                     0, s.buckets.length - 1);
    for (let i = i0; i <= i1; i++) {
      const key = s.uid + ':' + i;
      if (!p.passTouched.has(key)) {
        p.passTouched.add(key);
        s.buckets[i] += ERASE.passStrength;
      }
    }

    for (let i = 0; i < s.buckets.length; i++) {
      if (s.buckets[i] < ERASE.doneThreshold) return;
    }
    r.trail = null; r.stroke = null;
    this.removeStroke(s);
  }

  /* 손을 떼는 순간 어중간한 상태를 남기지 않는다.
     거의 다 지웠으면 마저 지우고, 아니면 원래대로 되돌린다.
     양 끝은 문대는 손이 되돌아가는 자리라 한 번밖에 안 지나가서 늘 남았다 —
     그 잔흔이 "여러 번 지워도 흔적이 남는다"의 정체다. */
  /* 손을 뗄 때 **닿았던 항목을 모두** 정리한다. 한 손짓이 여럿에 걸쳐 있다 */
  settleErase(p) {
    if (p && p.rubs.size) { p.rubs.forEach((r, item) => item.settleOwn()); return; }
    this.settleOwn();
  }

  settleOwn() {
    for (const s of this.strokes.slice()) {
      if (!s.buckets) continue;
      let done = 0;
      for (let i = 0; i < s.buckets.length; i++) {
        if (s.buckets[i] >= ERASE.doneThreshold) done++;
      }
      if (done / s.buckets.length >= ERASE.finishRatio) this.removeStroke(s);
      else this.restoreStroke(s);
    }
  }

  /* 덜 지워졌으면 잉크를 온전히 되돌린다. 부분적으로 지워진 상태는 저장하지 않으므로,
     화면도 저장된 것과 같아야 한다. */
  restoreStroke(s) {
    if (s.mask) { s.mask.remove(); s.mask = null; }
    s.el.removeAttribute('mask');
    s.buckets = null;
  }

  removeStroke(s) {
    Log.ev('erase', '', s.rec ? Math.round((s.rec.b - s.rec.a) * 100) : 0);
    haptic(ERASE.hapticOnErase);
    const i = this.strokes.indexOf(s);
    if (i >= 0) this.strokes.splice(i, 1);
    const j = this.data.strikes.indexOf(s.rec);
    if (j >= 0) this.data.strikes.splice(j, 1);
    this.syncStruck();

    const t0 = performance.now();
    const step = now => {
      const t = clamp((now - t0) / STROKE.eraseFadeMs, 0, 1);
      s.el.setAttribute('opacity', String(1 - t));
      if (t < 1) requestAnimationFrame(step);
      else { s.el.remove(); if (s.mask) s.mask.remove(); }
    };
    requestAnimationFrame(step);
  }
}

/* ═══════════════════════════════════════════════════════════════
   7. 화면 — 왼쪽 7칸 + 오른쪽 note. 한 주가 한 화면에 고정.
   ═══════════════════════════════════════════════════════════════ */
const App = {
  monday: null,
  week: null,
  guideOn: false,
  guideStep: 0,
  /* 사람이 이 기기에서 고친 횟수. 서버에 올린 뒤 이 값이 달라졌으면
     돌아온 응답은 이미 낡은 것이다 (spec §11 — 밀어 올리는 중의 획). */
  rev: 0,

  init() {
    /* 로그를 맨 먼저 켠다 — 바로 아래 probe()가 save_fail을 낼 수 있고,
       그때 로그가 아직 꺼져 있으면 사생활 모드가 통계에서 통째로 빠진다 */
    Log.start();
    Store.onBlocked = () => this.updateNote();
    Store.probe();                                 // 적기 전에 미리 알아낸다
    this.thisMonday = mondayOf(new Date());
    this.go(this.thisMonday);
    document.getElementById('today').addEventListener('click', () => {
      Log.ev('today', '', this.weekOffset());
      this.go(this.thisMonday);
    });
    document.getElementById('prev').addEventListener('click', () => this.shift(-7));
    document.getElementById('next').addEventListener('click', () => this.shift(7));
    this.bindSound();
    this.bindBackup();
    this.bindGuide();
    this.bindAuth();
    Sound.unlock();                // 첫 손짓에 소리를 미리 깨워 둔다
    Sync.start();
    /* 화면을 다시 켤 때가 기기를 바꾼 순간이다 — 그때 바로 맞춘다 */
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') Sync.push();
    });
    if (!guideSeen()) this.openGuide();

    /* 화면 크기가 바뀌면 열 경계와 획을 다시 맞춘다 */
    let resizeTimer = null;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => this.relayoutAll(), 120);
    });
  },

  /* 스크롤이 없으므로, 키보드가 올라오면 화면을 그만큼만 밀어 올린다 */
  keepVisible(el) {
    const vv = window.visualViewport;
    if (!vv) return () => {};
    const adjust = () => {
      const r = el.getBoundingClientRect();
      const over = r.bottom + 12 - (vv.height + vv.offsetTop);
      document.documentElement.style.setProperty(
        '--kb-shift', over > 0 ? (-over) + 'px' : '0px');
    };
    adjust();
    vv.addEventListener('resize', adjust);
    vv.addEventListener('scroll', adjust);
    return () => {
      vv.removeEventListener('resize', adjust);
      vv.removeEventListener('scroll', adjust);
      document.documentElement.style.setProperty('--kb-shift', '0px');
    };
  },

  shift(days) {
    const d = new Date(this.monday);
    d.setDate(d.getDate() + days);
    Log.ev('week', days < 0 ? 'prev' : 'next', this.weekOffset(d));
    this.go(d);
  },

  /* 이번 주에서 몇 주 떨어져 있나. 지난 주를 정말 고쳐 쓰는지 이 값으로 본다 */
  weekOffset(monday) {
    const from = monday || this.monday;
    if (!from || !this.thisMonday) return 0;
    return Math.round((from - this.thisMonday) / 604800000);
  },

  go(monday) {
    this.logged = {};              // 칸 상태는 주마다 새로 센다
    this.monday = monday;
    this.week = loadWeek(isoWeekId(monday));
    this.render();
    Cal.schedule();                // 이 주에 걸린 일정을 캘린더와 맞춘다 (spec §15)
  },

  save() {
    this.rev++;                    // 고친 것이 하나 늘었다
    saveWeek(this.week);
    Sync.schedule();
  },

  /* ── 동기화가 화면을 건드리는 통로는 이 넷뿐이다 ─────────── */
  currentWeek() { return this.week; },

  adopt(week) {
    if (!week || week.weekId !== this.week.weekId) return;
    /* 적는 중이거나 손이 닿아 있으면 아무것도 하지 않는다. 저장만 하고 화면을
       그대로 두면 메모리의 주가 저장본과 어긋나고, 다음 저장 때 방금 받은 것을
       덮어쓴다. 손을 떼거나 입력이 끝나는 순간 다시 맞춘다. */
    if (Gesture.busy || document.querySelector('.entry, .sublabel-entry')) return;

    /* 대개는 방금 내가 올린 것이 그대로 돌아온다 — 그때는 다시 그릴 것이 없다.
       매번 그리면 그리던 획이 지워지고 화면이 깜빡인다. */
    if (sameWeek(week, this.week)) { saveWeek(week); return; }

    saveWeek(week);
    this.week = loadWeek(week.weekId);
    this.render();
  },

  /* 캘린더에서 새로 온 것이 있다 — 저장하고 다시 그린다.
     손이 닿아 있거나 적는 중이면 그리지 않는다. 저장은 됐으니 다음에 맞는다. */
  adoptCalendar() {
    this.save();
    if (Gesture.busy || document.querySelector('.entry, .sublabel-entry')) return;
    this.render();
  },

  allWeeks() {
    const out = {};
    try {
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (!k || k.indexOf(STORE_PREFIX) !== 0) continue;
        const id = k.slice(STORE_PREFIX.length);
        if (!WEEK_ID_RE.test(id)) continue;
        out[id] = JSON.parse(localStorage.getItem(k));
      }
    } catch (e) { /* 깨진 주 하나가 전부를 막지 않는다 */ }
    return out;
  },

  /* 서버가 비워진 것을 알게 되면 이 기기도 비운다.
     force면 내가 비운 것이므로 무조건 지운다. 반환값: 비웠는지 여부 */
  applyReset(serverResetAt, force) {
    const at = Number(serverResetAt) || 0;
    if (!at || (!force && at <= localResetAt())) return false;
    this.clearLocalWeeks();
    setLocalResetAt(at);
    return true;
  },

  /* 이 기기의 주만 지운다. 비운 시각은 건드리지 않는다 —
     "서버 것으로 맞추기"는 서버를 비우는 것이 아니라 내 것을 버리는 것이다. */
  clearLocalWeeks() {
    try {
      const doomed = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.indexOf(STORE_PREFIX) === 0 &&
            WEEK_ID_RE.test(k.slice(STORE_PREFIX.length))) doomed.push(k);
      }
      doomed.forEach(k => localStorage.removeItem(k));
    } catch (e) { Store.fail(); }
    this.week = loadWeek(this.week.weekId); this.render();
  },

  adoptAll(weeks) {
    Object.keys(weeks).forEach(id => {
      if (!WEEK_ID_RE.test(id)) return;
      try { localStorage.setItem(STORE_PREFIX + id, JSON.stringify(weeks[id])); }
      catch (e) { Store.fail(); }
    });
    this.week = loadWeek(this.week.weekId); this.render();
  },

  /* 머리말 아래 한 줄 — 지금은 저장이 막혔다는 알림에만 쓴다 */
  updateNote() {
    const note = document.getElementById('note');
    const msg = Store.blocked ? '저장 안 됨 — 사생활 모드이거나 용량이 찼습니다' : '';
    note.hidden = !msg;
    note.textContent = msg;
    note.classList.toggle('warn', !!msg);
  },

  render() {
    document.getElementById('weekTitle').textContent = weekTitle(this.monday);
    document.getElementById('today').hidden =
      this.monday.getTime() === this.thisMonday.getTime();
    this.updateNote();

    const body = document.getElementById('weekBody');
    body.innerHTML = '';
    this.cells = {};

    const daysCol = document.createElement('div');
    daysCol.className = 'days';
    const freeCol = document.createElement('div');
    freeCol.className = 'free';
    body.appendChild(daysCol);
    body.appendChild(freeCol);

    WEEK_DAYS.forEach(key => daysCol.appendChild(this.buildCell(key)));
    freeCol.appendChild(this.buildCell('free'));

    /* 레이아웃이 잡힌 뒤에 열 수와 저장된 획을 반영한다 */
    requestAnimationFrame(() => this.relayoutAll());
  },

  buildCell(key) {
    const section = document.createElement('section');
    section.className = key === 'free' ? 'cell free-cell' : 'cell day';

    const listEl = document.createElement('div');
    listEl.className = 'cell-body';

    /* 왼쪽 여백 = 요일 라벨 + 그 아래 작은 메모 */
    const gutter = document.createElement('div');
    gutter.className = 'cell-gutter';

    const label = document.createElement('div');
    label.className = 'cell-label';
    label.textContent = cellLabel(key, this.monday);

    /* 메모는 div가 아니라 **항목 하나**다 — 그래야 그을 수 있다 (spec §4-6) */
    const sub = this.makeNote(key);

    gutter.appendChild(label);
    gutter.appendChild(sub.el);
    section.appendChild(gutter);
    section.appendChild(listEl);

    {
      /* 왼쪽 여백(날짜와 그 아래)을 누르면 **요일 아래 메모**를 적는다.
         예전에는 라벨을 살짝 눌러 항목을 만들고, 꾹 눌러 아래로 끌어 메모를 열었다.
         둘 다 물렸다 — 누르는 자리와 적히는 자리가 어긋나 있었다 (spec §4-2).
         지금은 **누른 자리에 적힌다**: 여백이면 메모, 칸이면 항목, note면 note.

         메모 글자 위는 그 항목의 제스처 자리다 — 긋고, 지우고, 탭하면 고친다.
         여기서 가로채면 그은 다음 손을 떼는 순간 입력창이 열린다. */
      gutter.addEventListener('click', e => {
        if (e.target.closest('.sublabel')) return;
        this.openSublabel(key);
      });

      /* 칸의 빈 곳을 눌러도 그 칸에 적힌다. 라벨만 누르게 하면 과녁이 너무 작다.
         항목·라벨·입력창 위는 각자의 제스처가 있으므로 건드리지 않고,
         움직였으면(긋기·훑어 지우기) 열지 않는다. */
      let spot = null, openOnClick = false;
      const plain = e => !e.target.closest('.item, .cell-gutter, .entry, .sublabel-entry');
      section.addEventListener('pointerdown', e => {
        /* **무엇으로 눌렀는지는 여기서만 알 수 있다** — click에는 없다 (spec §4-7) */
        spot = plain(e) ? { x: e.clientX, y: e.clientY } : null;
        openOnClick = false;
      });
      section.addEventListener('pointerup', e => {
        const from = spot;
        spot = null;
        openOnClick = !!from && plain(e) &&
          Math.hypot(e.clientX - from.x, e.clientY - from.y) < 10;
      });
      section.addEventListener('pointercancel', () => { spot = null; openOnClick = false; });

      /* **여백에서 그어도 인식한다** (spec §4-2). 사람들은 글자 왼쪽,
         날짜가 있는 여백에서부터 손을 긋기 시작한다 — 실제 사용에서 그랬다.
         거기서 시작한 손짓이 통째로 버려지면 "안 그어지는" 앱이 된다.
         **가로로 움직인 것이 분명해지는 순간** 그 높이의 항목에게 넘긴다.
         그전에는 넘기지 않는다 — 여백의 롱프레스는 항목 삭제가 아니고,
         세로 우세는 여기서 쓰는 손짓이 아니다. 메모 글자 위는 메모의 자리다. */
      if (key !== 'free') {
        let hand = null;
        const letGo = () => { hand = null; };
        gutter.addEventListener('pointerdown', e => {
          hand = e.target.closest('.sublabel')
            ? null : { id: e.pointerId, x: e.clientX, y: e.clientY };
        });
        section.addEventListener('pointermove', e => {
          if (!hand || e.pointerId !== hand.id) return;
          const dx = e.clientX - hand.x, dy = e.clientY - hand.y;
          if (Math.abs(dx) < STROKE.slopPx || Math.abs(dx) <= Math.abs(dy)) return;
          const from = hand;
          hand = null;
          const item = this.itemAtY(key, from.y);
          if (item) item.onDown(e, from);
        });
        section.addEventListener('pointerup', letGo);
        section.addEventListener('pointercancel', letGo);
      }
      section.addEventListener('click', () => {
        if (!openOnClick) return;
        openOnClick = false;
        /* **펜이 이미 판을 깨웠으면 물러난다.** 여기서 작은 줄을 열면 그 줄이
           포커스를 가져가고, 포커스를 잃은 판은 곧바로 잠든다 — 펜으로 톡
           누른 사람 눈에는 아무 일도 안 일어난 것처럼 보인다 (spec §4-7). */
        const c = this.cells[key];
        if (c && c.layer && c.layer.classList.contains('on')) return;
        this.openEntry(key, listEl);
      });
    }

    const items = this.week.days[key].map(data => {
      const item = this.makeItem(data, key, listEl);
      listEl.appendChild(item.el);
      return item;
    });

    /* 펜이 바로 내려앉을 자리를 미리 깔아 둔다 (spec §4-7).
       항목보다 아래에 깔리므로 글자 위는 여전히 긋기의 자리다. */
    const layer = this.padLayer(key, listEl, section);

    this.cells[key] = { section, listEl, items, sub, gutter, layer, mark: null };
    return section;
  },

  /* ── 요일 아래 메모 = 항목 하나 ───────────────────────────
     글자는 `notes[key]`, 획은 `noteStrikes[key]`에 그대로 담긴다.
     `data.strikes`가 그 배열 **자체**라서 StrikeItem이 밀고 빼는 것이
     곧 주 데이터가 된다 — 옮겨 담는 자리가 없으니 어긋날 자리도 없다. */
  noteData(key) {
    const strikes = this.week.noteStrikes[key];
    return {
      id: 'note:' + key,
      text: this.week.notes[key] || '',
      struck: strikes.length > 0,
      createdAt: 0,
      strikes,
    };
  },

  makeNote(key) {
    const item = new StrikeItem(this.noteData(key), {
      /* 그은 것도 지운 것도 메모를 고친 것이다 — 합칠 때 쓸 시각을 올린다 */
      save: () => { this.week.noteAt[key] = Date.now(); this.save(); },
      edit: () => this.openSublabel(key),
      add: () => this.openSublabel(key),     // 글자 옆 빈 자리
      remove: () => this.clearNote(key),     // 롱프레스 = 메모를 지운다
    }, 'sublabel');
    item.el.hidden = !item.data.text;        // 빈 메모는 자리를 차지하지 않는다
    return item;
  },

  /* 롱프레스·훑기로 메모를 지운다. 항목과 달리 무덤(graves)은 없다 —
     메모는 주마다 하나뿐이라 빈 글자가 곧 지웠다는 뜻이다. */
  clearNote(key) {
    const cell = this.cells[key];
    if (!cell) return;
    Log.ev('note', 'clear', 0);
    cell.sub.clearStrokes();
    cell.sub.data.strikes.length = 0;
    cell.sub.data.struck = false;
    cell.sub.data.text = '';
    cell.sub.textEl.textContent = '';
    cell.sub.el.classList.remove('purging');
    cell.sub.el.hidden = true;
    this.week.notes[key] = '';
    this.week.noteAt[key] = Date.now();
    this.save();
    this.updateOverflow(key);
  },

  /* 그 높이에 놓인 항목. 칸이 여러 단이면 **왼쪽 단부터** —
     여백에서 오는 손이 먼저 닿는 쪽이다. */
  itemAtY(key, y) {
    const cell = this.cells[key];
    if (!cell) return null;
    let best = null, bestLeft = Infinity;
    for (const item of cell.items) {
      if (item.el.hidden) continue;
      const r = item.el.getBoundingClientRect();
      if (r.height < 1 || y < r.top || y > r.bottom || r.left >= bestLeft) continue;
      bestLeft = r.left; best = item;
    }
    return best;
  },

  makeItem(data, dayKey, listEl) {
    return new StrikeItem(data, {
      /* 긋기·지우개도 여기를 지난다 — 합칠 때 어느 쪽이 나중인지 알아야 한다 */
      save: () => { data.updatedAt = Date.now(); this.save(); },
      edit: item => this.editItem(item, dayKey, listEl),
      add: () => this.openEntry(dayKey, listEl),   // 글자 옆 빈 자리를 눌렀을 때
      remove: item => this.removeItem(item, dayKey),
    });
  },

  relayoutCell(key) {
    const cell = this.cells[key];
    if (!cell) return;
    cell.listEl.scrollLeft = 0;      // 입력 중 밀려 있던 가로 위치를 되돌린다
    cell.listEl.scrollTop = 0;
    this.fitColumns(key);
    this.redraw(cell);
    this.placePad(key);
    this.updateOverflow(key);
  },

  /* 칸이 다시 짜였으면 그 칸의 획을 다시 그린다 — 요일 메모의 획도 그 칸의 것이다 */
  redraw(cell) {
    cell.items.forEach(item => { item.clearStrokes(); item.restore(); });
    if (cell.sub) { cell.sub.clearStrokes(); cell.sub.restore(); }
  },

  /* 한 열에 다 들어가면 한 열로 둔다. 넘치면 하나 늘려 다시 재 본다.
     note 칸은 화면 높이 전체라 한 열로 충분하므로 나누지 않는다. */
  fitColumns(key) {
    const cell = this.cells[key];
    const max = key === 'free' ? 1 : AUTO_SPLIT.maxColumns;
    for (let cols = 1; cols < max; cols++) {
      applyColumns(cell.section, cell.listEl, cols);
      if (this.hiddenCount(cell, true) === 0) return cols;
    }
    applyColumns(cell.section, cell.listEl, max);
    return max;
  },

  /* 항목이 늘거나 줄면 열 수가 바뀔 수 있다. 바뀌면 글씨 크기도 바뀌므로
     그 칸의 획을 다시 그린다. */
  refreshCell(key) {
    const cell = this.cells[key];
    if (!cell) return;
    const before = cell.listEl.style.columnCount;
    const cols = this.fitColumns(key);
    /* 두 단 이상으로 나뉜 것만 알린다. 한 단은 보통이라 셀 가치가 없다 */
    if (cols > 1) this.note1('split:' + key, () => Log.ev('split', '', cols, cell.items.length));
    if (cell.listEl.style.columnCount !== before) this.redraw(cell);
    this.placePad(key);
    this.updateOverflow(key);
  },

  relayoutAll() { Object.keys(this.cells).forEach(k => this.relayoutCell(k)); },

  /* 같은 사실을 이 주에서 한 번만 적는다. 다시 그릴 때마다 울리면 수가 뜻을 잃는다 */
  note1(key, fn) {
    if (!this.logged) this.logged = {};
    if (this.logged[key]) return;
    this.logged[key] = 1;
    fn();
  },

  /* ── 넘친 항목 — 데이터엔 있는데 칸 밖이라 안 보이는 것들 ──
     한 주가 한 화면이라 칸 높이가 고정이고, 넘치면 잘린다.
     잘렸다는 사실만 알린다. 숨기거나 줄이지 않는다 — 칸을 나누면 사라진다. */
  hiddenCount(cell, withEntry) {
    const box = cell.listEl.getBoundingClientRect();
    if (box.height < 1) return 0;
    const over = el => {
      const r = el.getBoundingClientRect();
      if (r.width < 1 && r.height < 1) return true;       // 아예 배치되지 못함
      return r.bottom > box.bottom + 1 || r.right > box.right + 1;
    };
    let n = 0;
    cell.items.forEach(item => { if (!item.el.hidden && over(item.el)) n++; });
    /* 열을 맞출 때는 **적는 중인 입력창도 자리를 차지한다.** 안 세면 열이 안 나뉘고,
       그러면 브라우저가 입력창을 보이려고 칸을 굴려 적힌 것들을 밀어낸다 (spec §4-1).
       잘렸다는 `+N` 표시에는 넣지 않는다 — 그건 항목 이야기다. */
    if (withEntry) {
      const entry = cell.listEl.querySelector('.entry');
      if (entry && over(entry)) n++;
    }
    return n;
  },

  updateOverflow(key) {
    const cell = this.cells[key];
    if (!cell) return;
    const n = this.hiddenCount(cell);
    if (n) this.note1('over:' + key, () => Log.ev('overflow', '', n, cell.items.length));
    if (!n) {
      if (cell.mark) { cell.mark.remove(); cell.mark = null; }
      return;
    }
    if (!cell.mark) {
      cell.mark = document.createElement('div');
      cell.mark.className = 'overflow-mark';
      cell.section.appendChild(cell.mark);
    }
    cell.mark.textContent = '+' + n;
  },

  /* ── 내 계정 — 제목을 0.5초 꾹 누르면 열린다 ───────────────
     로그인이 생기면서 계정을 두는 자리가 필요해졌다. 주간 화면에는
     아무것도 붙이지 않는다 — 만든 사람도 백업도 전부 여기 안에 있다. */
  bindBackup() {
    const title = document.getElementById('weekTitle');
    let timer = null;

    title.addEventListener('pointerdown', () => {
      clearTimeout(timer);
      timer = setTimeout(() => { timer = null; haptic(true); this.toggleBackup(); },
                         STROKE.longPressMs);
    });
    ['pointerup', 'pointercancel', 'pointerleave'].forEach(t =>
      title.addEventListener(t, () => { clearTimeout(timer); timer = null; }));

    document.getElementById('exportBtn').addEventListener('click', async () => {
      this.backupMsg('내보내는 중…');
      Log.ev('backup', 'export');
      try { this.backupMsg(await exportBackup()); }
      catch (e) { this.backupMsg('내보내지 못함'); }
    });

    const file = document.getElementById('importFile');
    document.getElementById('importBtn').addEventListener('click', () => {
      file.value = '';
      file.click();
    });
    file.addEventListener('change', () => {
      const f = file.files && file.files[0];
      if (!f) return;
      const reader = new FileReader();
      reader.onload = () => {
        const r = importBackup(String(reader.result));
        if (r.error) { Log.ev('backup', 'import-fail'); this.backupMsg(r.error); return; }
        Log.ev('backup', 'import', r.added, r.kept);
        this.go(this.monday);         // 지금 보는 주가 채워졌을 수 있다
        this.backupMsg(r.added + '개 주 가져옴' +
          (r.kept ? ' · ' + r.kept + '개는 이미 있어 그대로 둠' : ''));
      };
      reader.onerror = () => this.backupMsg('파일을 읽지 못함');
      reader.readAsText(f);
    });

    document.getElementById('acctClose').addEventListener('click', () => this.toggleBackup(false));
    document.getElementById('acctBtn').addEventListener('click', () => this.toggleBackup());
  },

  /* 화면을 덮으므로 주간 표의 높이는 그대로다 — 다시 맞출 것이 없다 */
  toggleBackup(force) {
    const panel = document.getElementById('account');
    const open = force === undefined ? panel.hidden : force;
    if (open === !panel.hidden) return;
    panel.hidden = !open;
    if (open) {
      Log.ev('account'); this.authStep = null;
      this.backupMsg(''); this.renderAuth();
    }
  },

  backupMsg(text) { document.getElementById('backupMsg').textContent = text || ''; },

  /* ── 첫 실행 안내 — 버튼이 하나도 없는 화면이라 첫 단서는 필요하다 ──
     아무 데나 누르면 이번만 닫히고, 다시 보지 않기를 누르면 영영 안 뜬다. */
  /* ── 소리 켜고 끄기 — 머리말의 스피커 표시 ─────────────────
     기기 무음을 무시하는 대신(spec §4-5) 여기서 끌 수 있어야 한다.
     설정 화면을 여는 것이 아니라 **누르면 바로 바뀌는** 손잡이 하나다. */
  bindSound() {
    const b = document.getElementById('soundBtn');
    const paint = () => {
      b.classList.toggle('on', Sound.on);
      b.setAttribute('aria-label', Sound.on ? '소리 끄기' : '소리 켜기');
      b.setAttribute('aria-pressed', String(Sound.on));
    };
    Sound.load();
    paint();
    b.addEventListener('click', () => {
      const on = !Sound.on;
      /* 켠 순간 한 번 들려 준다 — 켜졌다는 것을 귀로 확인시킨다.
         **깨어난 뒤에 내야 한다.** 사파리는 갓 만든 상자도 `resume()`도
         곧바로 `running`이 되지 않아서, 바로 부르면 `key()`가 그냥 물러난다. */
      Sound.setOn(on).then(() => { if (Sound.on) Sound.key(); });
      paint();
    });
  },

  bindGuide() {
    /* 아무 데나 눌러 한 줄씩 내려간다. 다 짚은 뒤에야 카드 밖을 눌러 닫힌다 */
    document.getElementById('guide').addEventListener('click', e => {
      if (e.target.closest('.guide-foot')) return;    // 발치 손잡이는 제 일을 한다
      const rows = this.guideRows();
      if (this.guideStep < rows.length - 1) { this.showGuideStep(this.guideStep + 1); return; }
      if (!e.target.closest('.guide-card')) this.closeGuide();
    });
    document.getElementById('guideClose').addEventListener('click', () => {
      if (document.getElementById('guideNever').checked) Log.ev('guide', 'never');
      this.closeGuide();
    });
    document.getElementById('guideBtn').addEventListener('click', () => {
      Log.ev('guide', 'reopen');
      this.toggleBackup(false);
      this.openGuide();
    });
  },

  /* ── 로그인 — 서랍 안에 둔다. 설정 화면은 여전히 없다 ──────
     링크가 아니라 여섯 자리 코드를 쓴다. 메일의 링크를 누르면 사파리가 열리는데,
     홈 화면 앱과 사파리는 저장소가 달라서 앱은 로그아웃인 채로 남는다. */
  bindAuth() {
    const el = id => document.getElementById(id);
    Sync.host = this;
    Sync.onChange = msg => this.renderAuth(msg);
    /* 로그인 직후 서버에 있는 것을 물어본다 — 기기를 새로 이을 때 그 답으로
       "합칠지" 물어야 한다 (§11의 처음 이을 때) */
    this.onLinked = () => this.firstLink();
    Cal.host = this;
    Cal.onChange = msg => this.renderAuth(msg);

    el('loginBtn').addEventListener('click', () => {
      this.authStep = 'login';
      this.renderAuth();
      el('loginEmail').focus();
    });

    el('logoutBtn').addEventListener('click', () => {
      Log.ev('login', 'logout');
      Sync.logout();
      this.authStep = null;
      this.renderAuth('로그아웃했습니다 · 이 기기의 기록은 그대로 있습니다');
    });

    el('authGo').addEventListener('click', () => this.doAuth());
    el('loginEmail').addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); el('loginPw').focus(); }
    });
    el('loginPw').addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); this.doAuth(); }
    });
    this.bindLink();
    this.renderAuth();
  },

  /* 로그인 하나로 두 앱이 이어진다 (spec §11, 2026-08-24).
     같은 화면에서 로그인·계정 만들기 둘 다 처리한다 — 사용자는 자기가 계정을
     이 앱에서 만들었는지, 캘린더에서 만들었는지 기억할 필요가 없다.
     로그인부터 시도하고, "없는 계정"이면 자동으로 만든다. */
  async doAuth() {
    if (this.authBusy) return;
    this.authBusy = true;
    const email = document.getElementById('loginEmail').value.trim();
    const pw = document.getElementById('loginPw').value;
    if (!email || !pw) { this.renderAuth('메일과 비밀번호를 넣으세요'); this.authBusy = false; return; }
    this.renderAuth('맞추는 중…');
    try {
      try { await Sync.signIn(email, pw); }
      catch (e) {
        /* 없는 계정이면 만든다. 나머지 오류는 그대로 알린다. */
        const missing = e.code === 'EMAIL_NOT_FOUND'
          || e.code === 'INVALID_LOGIN_CREDENTIALS';
        if (!missing) throw e;
        Log.ev('login', 'request');
        await Sync.signUp(email, pw);
      }
      Log.ev('login', 'verify');
      document.getElementById('loginPw').value = '';
    } catch (e) {
      Log.ev('login', 'fail');
      this.renderAuth(AUTH_ERRORS[e.code] || '안 됐습니다 · 잠시 뒤에 다시');
    } finally { this.authBusy = false; }
  },

  /* 기기를 처음 이을 때 — 양쪽에 다 기록이 있으면 합치기 전에 물어본다.
     한쪽만 있으면 물을 것이 없다. 그냥 맞춘다. */
  async firstLink() {
    this.renderAuth('맞추는 중…');
    const mine = Object.keys(this.allWeeks()).length;
    let theirs = 0;
    try {
      const peek = await Sync.peek();
      if (this.applyReset(peek.resetAt)) return;      // 그 사이 비워졌다면 그것부터
      theirs = Object.keys(peek.weeks || {}).length;
    } catch (e) { /* 못 보면 그냥 합친다 */ }

    if (mine && theirs) {
      document.getElementById('linkRow').hidden = false;
      this.renderAuth('이 기기에 ' + mine + '주, 서버에 ' + theirs + '주가 있습니다 · 어떻게 할까요');
      return;
    }
    await Sync.syncAll();
    /* 캘린더 쪽도 곧바로 왕복한다 — 로그인이 이 둘의 손잡이라, 늦으면 사용자가
       "이어졌다"고 느끼는 순간과 실제 오가는 시점이 어긋난다 (spec §11) */
    await Cal.run();
    this.renderAuth();
  },

  bindLink() {
    const done = async (msg, before) => {
      document.getElementById('linkRow').hidden = true;
      this.renderAuth(msg);
      try {
        if (before) await before();
        await Sync.syncAll();
        Sync.begin();
        this.renderAuth();
      } catch (e) { this.renderAuth('안 됐습니다 · 잠시 뒤에 다시'); }
    };
    document.getElementById('linkMerge').addEventListener('click',
      () => done('합치는 중…'));
    /* 서버를 비우되 이 기기 것은 남긴다 — 곧바로 올려 새 출발점으로 삼는다 */
    document.getElementById('linkMine').addEventListener('click',
      () => done('이 기기 것으로 맞추는 중…', () => Sync.wipe(true)));
    /* 서버는 그대로 두고 내 것을 버린다 — 올릴 것이 없으면 서버 것만 내려온다 */
    document.getElementById('linkTheirs').addEventListener('click',
      () => done('서버 것으로 맞추는 중…', async () => this.clearLocalWeeks()));

    /* 전부 비우기 — 되돌릴 수 없으므로 두 번 눌러야 한다 */
    const wipeBtn = document.getElementById('wipeBtn');
    wipeBtn.addEventListener('click', async () => {
      if (!this.wipeArmed) {
        this.wipeArmed = true;
        wipeBtn.textContent = '정말 비웁니다';
        this.renderAuth('한 번 더 누르면 서버와 모든 기기의 기록이 지워집니다 · 되돌릴 수 없습니다');
        clearTimeout(this.wipeTimer);
        this.wipeTimer = setTimeout(() => {
          this.wipeArmed = false;
          wipeBtn.textContent = '전부 비우기';
          this.renderAuth();
        }, 5000);
        return;
      }
      clearTimeout(this.wipeTimer);
      this.wipeArmed = false;
      wipeBtn.textContent = '전부 비우기';
      this.renderAuth('비우는 중…');
      try {
        await Sync.wipe(false);
        this.renderAuth('전부 비웠습니다 · 다른 기기도 열면 비워집니다');
      } catch (e) {
        this.renderAuth('비우지 못했습니다 · 잠시 뒤에 다시');
      }
    });
  },

  renderAuth(msg) {
    const el = id => document.getElementById(id);
    const on = this.authStep === 'login';
    /* 로그인은 두 값(CAL.apiKey·projectId)이 있어야 시작한다. 서버(KV)와
       Firebase는 별개다 — 둘 중 하나만 있어도 계정 줄은 낼 수 있다. */
    const canLogin = Sync.live();
    el('authRow').hidden = !canLogin && !Sync.email;
    el('loginBtn').hidden = !canLogin || !!Sync.email || on;
    el('logoutBtn').hidden = !Sync.email;
    el('authFormRow').hidden = !on;
    el('authPwRow').hidden = !on;
    el('wipeRow').hidden = !Sync.email || on;
    if (!Sync.email) { el('linkRow').hidden = true; this.wipeArmed = false; }
    if (!this.wipeArmed) el('wipeBtn').textContent = '전부 비우기';
    /* 머리말의 사람 표시도 같이 바뀐다 */
    el('acctBtn').classList.toggle('on', !!Sync.email);
    el('authMsg').textContent = msg || (Sync.email
      ? Sync.email + ' · 자동으로 맞춰집니다'
      : on ? '이메일과 비밀번호로 로그인합니다 · 없으면 만들어집니다'
           : '이 기기에만 저장됩니다');
    if (this.guideOn) {
      el('guideSync').hidden = !canLogin;
      this.showGuideStep(this.guideStep);
    }
  },

  openGuide() {
    if (this.guideOn) return;
    this.guideOn = true;
    document.getElementById('guideNever').checked = false;
    /* 서버가 없으면 로그인 버튼이 아예 안 나타난다 (spec §13).
       없는 것을 안내하지 않는다. `/api/me`가 늦게 오면 renderAuth가 다시 맞춘다. */
    document.getElementById('guideSync').hidden = !Sync.ready;
    document.getElementById('guide').hidden = false;
    this.showGuideStep(0);
  },

  /* 보이는 줄만 센다 — 서버가 없으면 로그인 줄이 빠진다 */
  guideRows() {
    return Array.from(document.querySelectorAll('.guide-list li')).filter(li => !li.hidden);
  },

  /* 한 번에 한 줄만 또렷하다. 끝까지 짚어야 닫을 수 있다 —
     넷을 한꺼번에 늘어놓으면 어디부터 읽을지가 없다 (spec §4-4). */
  showGuideStep(i) {
    const rows = this.guideRows();
    if (!rows.length) return;
    this.guideStep = clamp(i, 0, rows.length - 1);
    rows.forEach((li, n) => li.classList.toggle('on', n === this.guideStep));
    const last = this.guideStep >= rows.length - 1;
    document.querySelector('.guide-foot').classList.toggle('wait', !last);
    document.getElementById('guideClose').disabled = !last;
    document.getElementById('guideNever').disabled = !last;
  },

  /* 닫는 길이 여럿이라 어디로 닫든 체크한 뜻은 지킨다 */
  closeGuide() {
    if (!this.guideOn) return;
    if (document.getElementById('guideNever').checked) markGuideSeen();
    document.getElementById('guide').hidden = true;
    this.guideOn = false;
  },

  /* ── 적기: 인라인 입력, 엔터로 연속 입력 ─────────────────── */
  openEntry(dayKey, listEl) {
    const open = listEl.querySelector('.entry');
    if (open) { open.focus(); return; }

    const input = document.createElement('input');
    input.className = 'entry';
    input.type = 'text';
    input.setAttribute('autocomplete', 'off');
    input.setAttribute('autocapitalize', 'sentences');
    input.setAttribute('enterkeyhint', 'enter');

    let closed = false;
    const release = this.keepVisible(input);
    const close = () => {
      if (closed) return;
      closed = true;
      release();
      input.remove();
      listEl.scrollLeft = 0;         // 넘친 항목은 칸을 나눠야 보인다
      listEl.scrollTop = 0;
      this.refreshCell(dayKey);
      Sync.push();                   // 적기를 마쳤으니 이제 맞춰도 된다
    };

    /* 적힌 것이 있으면 항목으로 확정한다. 엔터로도, 딴 데를 눌러도 같다. */
    const commitText = () => {
      const text = input.value.trim();
      if (!text) return false;

      const now = Date.now();
      const data = {
        id: String(++uidSeq) + '-' + now,
        text, struck: false, createdAt: now, updatedAt: now, strikes: [],
      };
      this.week.days[dayKey].push(data);
      this.save();
      /* 글자는 보내지 않는다. 길이만 — 한 줄에 안 들어가는 일이 잦은지 보려고 */
      Log.ev('add', dayKey === 'free' ? 'free' : 'day',
             text.length, this.week.days[dayKey].length);

      Cal.schedule();      // 새로 적은 것만 캘린더로 간다 (spec §15)

      const item = this.makeItem(data, dayKey, listEl);
      listEl.insertBefore(item.el, input);    // 입력창은 늘 목록 맨 아래
      if (this.cells[dayKey]) this.cells[dayKey].items.push(item);
      item.restore();
      this.refreshCell(dayKey);               // 항목이 늘면 열이 늘고, 남으면 잘렸다고 표시된다
      input.value = '';                       // 다음 줄 입력창이 바로 이어짐
      return true;
    };

    input.addEventListener('keydown', e => {
      if (e.key !== 'Enter') return;
      e.preventDefault();
      if (!commitText()) { close(); input.blur(); }   // 빈 채로 엔터 = 종료
    });
    input.addEventListener('blur', () => { commitText(); close(); });
    /* blur만 믿지 않는다. 모바일 키보드는 blur 시점이 제각각이고, 앱이 뒤로
       넘어가면 아예 안 올 수도 있다. 적은 것이 사라지는 것보다 나쁜 일은 없으므로
       "딴 데를 누른 순간"과 "화면을 떠나는 순간"에도 확정한다. */
    keepText(input, () => { commitText(); close(); });
    typeSound(input);

    listEl.appendChild(input);
    /* 넣은 다음에 열을 다시 맞춘다 — 입력창이 들어갈 자리를 먼저 만들어야
       브라우저가 칸을 굴리지 않는다. */
    this.refreshCell(dayKey);
    this.focusInCell(input, listEl);
  },

  /* ── 필기판 — 펜이 바로 내려앉는 자리 (spec §4-7) ──────────
     칸마다 투명한 입력창이 **미리 깔려 있다.** 아이패드 손글씨 변환은
     입력창 위에서만 도는데, 탭해서 만든 다음에 쓰라고 하면 손이 한 번 더 간다.
     펜을 대는 순간 이미 거기 있으니 **그냥 쓰면 된다.**

     깨어나는 길은 하나다: 그 입력창이 포커스를 받는 것. 펜으로 톡 누르든,
     스크리블이 글씨를 알아보고 스스로 포커스를 주든 같은 자리로 들어온다.
     **손가락이 준 포커스만 걸러 낸다** — 손가락은 예전처럼 작은 줄이 열려야 한다. */
  padLayer(key, listEl, section) {
    const layer = document.createElement('input');
    layer.className = 'pad-layer';
    layer.type = 'text';
    layer.setAttribute('autocomplete', 'off');
    layer.setAttribute('autocapitalize', 'sentences');
    layer.setAttribute('enterkeyhint', 'enter');
    layer.setAttribute('aria-label', '펜으로 적기');
    /* **자판을 부르지 않는다.** 손가락이 잘못 눌러 포커스가 가더라도 자판이
       올라오지 않아야 화면이 덜컹거리지 않는다. 깨어날 때 되돌린다. */
    layer.inputMode = 'none';

    /* 손가락·마우스가 이 판을 누른 시각. 스크리블은 포인터 없이 포커스를 준다 */
    layer.addEventListener('pointerdown', e => {
      if (e.pointerType !== 'pen') this.padTouchAt = e.timeStamp;
    });
    layer.addEventListener('focus', e => {
      if (performance.now() - (this.padTouchAt || -1e9) < PAD.guardMs) {
        layer.blur();          // 손가락이다 — 칸의 보통 손짓에 맡긴다
        return;
      }
      this.wakePad(key, layer);
    });
    section.appendChild(layer);
    return layer;
  },

  /* 깔린 판을 깨운다 — 여기서부터 크게 보이고, 크게 적힌다 */
  wakePad(key, layer) {
    if (layer.classList.contains('on')) return;
    layer.classList.add('on');
    layer.inputMode = 'text';

    const cell = this.cells[key];
    let closed = false;
    const sleep = () => {
      if (closed) return;
      closed = true;
      layer.classList.remove('on');
      layer.inputMode = 'none';
      layer.value = '';
      this.refreshCell(key);
      Sync.push();
    };

    /* 확정 규칙은 보통 입력과 같다 (spec §4-1) */
    const commitText = () => {
      const text = layer.value.trim();
      if (!text) return false;
      const now = Date.now();
      const data = {
        id: String(++uidSeq) + '-' + now,
        text, struck: false, createdAt: now, updatedAt: now, strikes: [],
      };
      this.week.days[key].push(data);
      this.save();
      Log.ev('add', key === 'free' ? 'free' : 'day', text.length,
             this.week.days[key].length);
      Cal.schedule();

      const item = this.makeItem(data, key, cell.listEl);
      cell.listEl.appendChild(item.el);
      cell.items.push(item);
      item.restore();
      this.refreshCell(key);
      this.placePad(key);        // 항목이 늘면 칸이 나뉘고 판 자리도 달라진다
      layer.value = '';          // 이어서 다음 것을 쓴다
      return true;
    };

    layer.addEventListener('keydown', function onKey(e) {
      if (e.key !== 'Enter') return;
      e.preventDefault();
      if (!commitText()) { layer.removeEventListener('keydown', onKey); sleep(); layer.blur(); }
    });
    layer.addEventListener('blur', () => { commitText(); sleep(); }, { once: true });
    /* 딴 데를 누르거나 화면을 떠나도 적은 것은 남는다 (spec §4-1) */
    keepText(layer, () => { commitText(); sleep(); }, layer);
    typeSound(layer);
  },

  /* 판은 그 칸의 **적히는 자리**를 그대로 덮는다. 요일 칸은 여백 오른쪽,
     note 칸은 라벨 아래 — 칸마다 다르므로 실제 상자를 재서 맞춘다. */
  placePad(key) {
    const cell = this.cells[key];
    if (!cell || !cell.layer) return;
    const s = cell.section.getBoundingClientRect();
    const b = cell.listEl.getBoundingClientRect();
    if (b.height < 1) return;
    const st = cell.layer.style;
    st.left = (b.left - s.left) + 'px';
    st.top = (b.top - s.top) + 'px';
    st.width = b.width + 'px';
    st.height = b.height + 'px';
  },

  /* `.cell-body`는 `overflow: hidden`이지만 **굴러가기는 한다.**
     포커스를 주면 브라우저가 입력창을 보이려고 칸을 굴려, 적힌 것들이
     위(또는 옆)로 밀려 사라진다. 되돌릴 손잡이도 없다.
     굴리지 말라고 이르고, 혹시 굴렀으면 되돌린다 (spec §4-1). */
  focusInCell(input, listEl) {
    input.focus({ preventScroll: true });
    const box = listEl.getBoundingClientRect();
    const r = input.getBoundingClientRect();
    if (r.bottom <= box.bottom + 1 && r.right <= box.right + 1) {
      listEl.scrollTop = 0;                 // 자리를 얻었다 — 굴릴 이유가 없다
      listEl.scrollLeft = 0;
      return;
    }
    /* 칸이 정말 꽉 차 입력창이 자리를 못 얻었다(3단이 한계).
       그때는 굴리는 편이 낫다 — 안 보이는 채로 적게 두는 것보다는.
       닫으면 `close()`가 다시 0으로 돌린다. */
    input.scrollIntoView({ block: 'nearest', inline: 'nearest' });
  },

  /* ── 요일 아래 메모 — 6.5pt 세미볼드 ─────────────────────── */
  openSublabel(key) {
    const cell = this.cells[key];
    if (!cell) return;
    const { gutter, sub } = cell;
    if (gutter.querySelector('.sublabel-entry')) return;
    /* 그어진 것은 고치지 못한다 — 항목과 같은 규칙이다 (spec §4-6).
       지우개로 문대거나 꾹 눌러 지운 다음에야 다시 적을 수 있다. */
    if (sub.data.struck) return;

    const input = document.createElement('input');
    input.className = 'sublabel-entry';
    input.type = 'text';
    input.value = this.week.notes[key] || '';
    input.setAttribute('enterkeyhint', 'done');

    let closed = false;
    const release = this.keepVisible(input);
    const commit = () => {
      if (closed) return;
      closed = true;
      release();
      const text = input.value.trim();
      input.remove();
      this.week.notes[key] = text;
      this.week.noteAt[key] = Date.now();
      Log.ev('note', text ? 'set' : 'clear', text.length);
      sub.data.text = text;
      sub.textEl.textContent = text;
      sub.el.hidden = !text;
      this.save();
      this.updateOverflow(key);      // 메모가 한 줄 차지하면 항목이 밀린다
    };
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); input.blur(); }
    });
    input.addEventListener('blur', commit);
    keepText(input, commit);
    typeSound(input);

    sub.el.hidden = true;
    gutter.appendChild(input);
    input.focus();
    input.setSelectionRange(input.value.length, input.value.length);
  },

  /* ── 편집: 그어진 항목은 편집 불가 ───────────────────────── */
  editItem(item, dayKey, listEl) {
    if (item.data.struck) return;
    const input = document.createElement('input');
    input.className = 'entry';
    input.type = 'text';
    input.value = item.data.text;
    input.setAttribute('enterkeyhint', 'done');

    let closed = false;
    const release = this.keepVisible(input);
    const commit = () => {
      if (closed) return;
      closed = true;
      release();
      const text = input.value.trim();
      input.remove();
      if (!text) { this.removeItem(item, dayKey); return; }
      item.data.text = text;
      item.data.updatedAt = Date.now();
      Log.ev('edit', dayKey === 'free' ? 'free' : 'day', text.length);
      Cal.schedule();
      item.textEl.textContent = text;
      this.save();
      item.el.hidden = false;                 // 제자리에 그대로 둔다
      this.refreshCell(dayKey);
    };

    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); input.blur(); }
    });
    input.addEventListener('blur', commit);
    keepText(input, commit);
    typeSound(input);

    item.el.hidden = true;
    listEl.insertBefore(input, item.el);
    this.focusInCell(input, listEl);
    input.setSelectionRange(input.value.length, input.value.length);
  },

  /* ── 삭제: 롱프레스. 확인 다이얼로그 없음 ────────────────── */
  removeItem(item, dayKey) {
    Log.ev('del', dayKey === 'free' ? 'free' : 'day', item.data.struck ? 1 : 0);
    const list = this.week.days[dayKey];
    const i = list.indexOf(item.data);
    if (i >= 0) list.splice(i, 1);
    /* 지웠다는 사실을 남긴다. 없으면 다른 기기와 합칠 때 되살아난다 */
    if (item.data.id) this.week.graves[item.data.id] = Date.now();
    this.save();
    item.el.remove();
    const cell = this.cells[dayKey];
    if (cell) {
      const j = cell.items.indexOf(item);
      if (j >= 0) cell.items.splice(j, 1);
      this.refreshCell(dayKey);
    }
  },
};

/* ═══════════════════════════════════════════════════════════════
   8. 확대 차단 — iOS 사파리는 user-scalable=no를 무시하므로 직접 막는다
   ═══════════════════════════════════════════════════════════════ */
['gesturestart', 'gesturechange', 'gestureend'].forEach(type => {
  document.addEventListener(type, e => e.preventDefault(), { passive: false });
});
document.addEventListener('touchmove', e => {
  if (e.touches.length > 1) e.preventDefault();   /* 두 손가락 = 확대 시도 */
}, { passive: false });

App.init();
</script>
</body>
</html>
