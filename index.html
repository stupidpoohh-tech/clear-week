<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#faf9f4">
<title>Clear Week — 긋기 데모</title>
<style>
  :root {
    --paper: #faf9f4;          /* 옅은 미색 종이 */
    --ink: #1d2b50;            /* 본문 잉크: 짙은 남색 */
    --ink-faint: #8b90a0;      /* 보조 텍스트 */
    --rule: #d9d6cb;           /* 칸 구분선 */
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
                 "Pretendard", "Noto Sans KR", "Segoe UI", sans-serif;
    -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
  }
  main {
    max-width: 560px;
    margin: 0 auto;
    padding: calc(env(safe-area-inset-top, 0px) + 20px)
             calc(env(safe-area-inset-right, 0px) + 20px)
             calc(env(safe-area-inset-bottom, 0px) + 40px)
             calc(env(safe-area-inset-left, 0px) + 20px);
  }
  header h1 {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }
  header .hint {
    margin-top: 6px;
    font-size: 12px;
    line-height: 1.7;
    color: var(--ink-faint);
  }
  .list {
    margin-top: 20px;
    border-top: 1px solid var(--rule);
  }
  .item {
    position: relative;
    min-height: 52px;
    display: flex;
    align-items: center;
    padding: 12px 4px;
    border-bottom: 1px solid var(--rule);
    touch-action: pan-y;     /* 세로 = 스크롤(브라우저), 가로 = 긋기/지우기(JS) */
    cursor: default;
  }
  .item-text {
    font-size: 17px;
    line-height: 1.45;
    overflow-wrap: anywhere;
  }
  .strike-svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: visible;
    pointer-events: none;
    transform-origin: 50% 50%;
  }
  .item.pulse .strike-svg { animation: settle 120ms ease-out; }
  @keyframes settle {
    0%   { transform: scale(1, 1); }
    40%  { transform: scale(1.01, 1.12); }
    100% { transform: scale(1, 1); }
  }
  footer { margin-top: 28px; text-align: center; }
  #reset {
    border: none;
    background: none;
    font: inherit;
    font-size: 12px;
    color: var(--ink-faint);
    text-decoration: underline;
    padding: 8px 12px;
    cursor: pointer;
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>Clear Week</h1>
    <p class="hint">
      긋기 — 글자 위를 좌우로 드래그<br>
      더블탭 — 자동으로 그어짐<br>
      지우기 — 그어진 항목을 쓱싹쓱싹 문대기
    </p>
  </header>
  <section class="list" id="list"></section>
  <footer><button id="reset" type="button">데모 초기화</button></footer>
</main>

<script>
'use strict';

/* ═══════════════════════════════════════════════════════════════
   1. 획 파라미터 — 손맛 튜닝은 전부 여기서.
   ═══════════════════════════════════════════════════════════════ */
const STROKE = {
  /* ── 획 모양 ─────────────────────────────────────────────── */
  noiseAmplitude: 0.9,   // 획 흔들림 진폭 (px). 올리면 더 삐뚤어짐
  noiseFrequency: 0.018, // 흔들림 주기 (1/px). 올리면 잘게 지글거림
  widthMin: 1.6,         // 최소 굵기 (px) — 빠르게 그을 때
  widthMax: 3.2,         // 최대 굵기 (px) — 천천히 그을 때
  taperLen: 8,           // 양끝이 얇아지는 구간 길이 (px)
  tiltMax: 0.02,         // 획 전체의 무작위 기울기 (dy/dx 최대값)
  followY: 0.25,         // 손가락 상하 움직임 반영 비율 (0=수평 고정, 1=그대로)
  speedRef: 1.4,         // 이 속도(px/ms)에서 굵기가 widthMin까지 얇아짐
  widthNoise: 0.06,      // 굵기 자체의 미세 흔들림 비율
  widthNoiseFreq: 0.08,  // 굵기 흔들림 주기 (1/px)
  inkColor: '#26356b',   // 취소선 잉크색

  /* ── 판정 ────────────────────────────────────────────────── */
  commitRatio: 0.6,      // 확정 임계값 (텍스트 폭 대비 통과 비율)
  slopPx: 8,             // 긋기 vs 스크롤 초기 방향 판정 이동량 (px)
  doubleTapMs: 300,      // 더블탭 판정 간격 (ms)
  hapticOnCommit: true,  // 확정 시 진동 (iOS 사파리는 지원 안 함 → 무시됨)

  /* ── 손으로 그은 획은 그은 만큼만 남는다 ─────────────────── */
  //  확정돼도 손가락이 지나간 구간 밖으로는 늘어나지 않음.

  /* ── 자동으로 그어지는 획 (감긴 나머지 줄, 더블탭) ───────── */
  strikeAllLines: true,  // 두 줄 이상 감긴 항목은 나머지 줄도 자동으로 긋기
  overshoot: 2,          // 자동 획이 텍스트 밖으로 삐져나가는 양 (px)
  autoStrokeMs: 220,     // 자동 획 하나가 그어지는 시간 (ms)
  autoStagger: 70,       // 줄과 줄 사이 시차 (ms)

  /* ── 애니메이션 ──────────────────────────────────────────── */
  rewindMs: 200,         // 임계값 미달 시 선이 되감기는 시간 (ms)
  restoreMs: 160,        // 지우다 만 획이 되살아나는 시간 (ms)
};

/* ── 문대서 지우기 ─────────────────────────────────────────── */
const ERASE = {
  minReversals: 3,       // 좌우 방향이 몇 번 바뀌면 '문지르기'로 판정
  minSegment: 6,         // 방향 전환으로 인정할 최소 이동 거리 (px)
  rubDistance: 320,      // 판정 후 이만큼 더 문대면 완전히 지워짐 (px)
  hapticOnErase: true,
};

/* ── 사각사각 소리 ─────────────────────────────────────────── */
const SOUND = {
  enabled: true,
  volume: 0.35,          // 최대 음량 (0~1)
  bandHz: 1900,          // 사각거림의 중심 주파수 (Hz). 낮추면 둔탁해짐
  bandQ: 0.9,            // 필터 폭. 올리면 더 '쉭' 하는 소리
  speedRef: 1.0,         // 이 속도(px/ms)에서 음량 최대
  floor: 0.25,           // 아주 느리게 그어도 유지되는 최소 음량 비율
  attackMs: 10,
  releaseMs: 80,
};

/* ── 더미 항목 (1단계: 긋기 감각 테스트용) ─────────────────── */
const DEMO_ITEMS = [
  '회의 자료 정리',
  '장보기 — 우유, 달걀, 두부',
  '은행 들러서 서류 떼기',
  '영어 단어 30개 외우고 저녁에 복습까지 끝내기 (두 줄 감김 테스트용으로 일부러 긴 항목)',
  '운동 30분',
];

/* ═══════════════════════════════════════════════════════════════
   2. 유틸
   ═══════════════════════════════════════════════════════════════ */
const NS = 'http://www.w3.org/2000/svg';
const TAU = Math.PI * 2;
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
const easeOut = t => 1 - (1 - t) * (1 - t);
const easeIn = t => t * t;

function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* 획 하나의 결(흔들림·기울기·굵기 요동)을 시드에서 만든다 */
function makeGrain(seed) {
  const rnd = mulberry32(seed);
  const p1 = rnd() * TAU, p2 = rnd() * TAU, p3 = rnd() * TAU;
  const tilt = (rnd() * 2 - 1) * STROKE.tiltMax;
  const f = STROKE.noiseFrequency * TAU;
  const fw = STROKE.widthNoiseFreq * TAU;
  return {
    tilt,
    noise: x => STROKE.noiseAmplitude *
      (0.7 * Math.sin(x * f + p1) + 0.3 * Math.sin(x * f * 2.3 + p2)),
    widthJitter: x => 1 + STROKE.widthNoise * Math.sin(x * fw + p3),
  };
}

/* 점 배열 → 굵기 변화가 있는 채움 패스(d).
   fraction < 1 이면 앞에서부터 그만큼만 그린다 (자라남 / 되감김). */
function buildPathD(points, fraction = 1) {
  const n = Math.max(0, Math.round(points.length * clamp(fraction, 0, 1)));
  if (n < 2) return '';
  const pts = points.slice(0, n);

  const dist = [0];
  for (let i = 1; i < pts.length; i++) {
    dist.push(dist[i - 1] + Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y));
  }
  const total = dist[dist.length - 1];
  if (total < 1) return '';

  const top = [], bot = [];
  for (let i = 0; i < pts.length; i++) {
    const p = pts[i];
    const taper = clamp(Math.min(dist[i], total - dist[i]) / STROKE.taperLen, 0, 1);
    const h = Math.max(0.3, p.w * (0.3 + 0.7 * Math.sqrt(taper))) / 2;
    top.push(p.x.toFixed(1) + ',' + (p.y - h).toFixed(1));
    bot.push(p.x.toFixed(1) + ',' + (p.y + h).toFixed(1));
  }
  bot.reverse();
  return 'M' + top.join('L') + 'L' + bot.join('L') + 'Z';
}

/* span이 차지한 줄(line box)들의 사각형 — 두 줄 이상 감김 대응 */
function lineRects(span) {
  const range = document.createRange();
  range.selectNodeContents(span);
  return Array.from(range.getClientRects()).filter(r => r.width > 1 && r.height > 1);
}

function lineIndexAt(rects, clientY) {
  let best = 0, bestDist = Infinity;
  for (let i = 0; i < rects.length; i++) {
    const r = rects[i];
    if (clientY >= r.top && clientY <= r.bottom) return i;
    const d = Math.min(Math.abs(clientY - r.top), Math.abs(clientY - r.bottom));
    if (d < bestDist) { bestDist = d; best = i; }
  }
  return best;
}

function haptic(on) {
  if (on && navigator.vibrate) navigator.vibrate(12);
}

/* ═══════════════════════════════════════════════════════════════
   3. 사각사각 소리 — 필터를 통과시킨 노이즈의 음량을 손 속도로 조절
   ═══════════════════════════════════════════════════════════════ */
const Sound = {
  ctx: null, gain: null, filter: null,

  init() {
    if (this.ctx || !SOUND.enabled) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.ctx = new AC();

    const len = Math.floor(this.ctx.sampleRate * 2);
    const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    let brown = 0;
    for (let i = 0; i < len; i++) {
      const w = Math.random() * 2 - 1;
      brown = (brown + 0.02 * w) / 1.02;      // 종이 특유의 저역 성분
      d[i] = clamp(w * 0.75 + brown * 2.5, -1, 1);
    }

    const src = this.ctx.createBufferSource();
    src.buffer = buf;
    src.loop = true;

    this.filter = this.ctx.createBiquadFilter();
    this.filter.type = 'bandpass';
    this.filter.frequency.value = SOUND.bandHz;
    this.filter.Q.value = SOUND.bandQ;

    this.gain = this.ctx.createGain();
    this.gain.gain.value = 0;

    src.connect(this.filter);
    this.filter.connect(this.gain);
    this.gain.connect(this.ctx.destination);
    src.start();
  },

  resume() {
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  },

  /* speed: px/ms */
  scratch(speed) {
    if (!this.ctx || !SOUND.enabled) return;
    const s = clamp(speed / SOUND.speedRef, 0, 1);
    const level = (SOUND.floor + (1 - SOUND.floor) * s) * SOUND.volume;
    const now = this.ctx.currentTime;
    this.gain.gain.setTargetAtTime(level, now, SOUND.attackMs / 1000);
    this.filter.frequency.setTargetAtTime(SOUND.bandHz * (0.85 + 0.4 * s), now, 0.02);
  },

  silence() {
    if (!this.ctx) return;
    this.gain.gain.setTargetAtTime(0, this.ctx.currentTime, SOUND.releaseMs / 1000);
  },
};

/* ═══════════════════════════════════════════════════════════════
   4. 항목 하나 = StrikeItem
      상태: idle → (긋기) → struck → (문대기) → idle
   ═══════════════════════════════════════════════════════════════ */
class StrikeItem {
  constructor(text, container) {
    this.el = document.createElement('div');
    this.el.className = 'item';

    this.textEl = document.createElement('span');
    this.textEl.className = 'item-text';
    this.textEl.textContent = text;

    this.svg = document.createElementNS(NS, 'svg');
    this.svg.setAttribute('class', 'strike-svg');

    this.el.appendChild(this.textEl);
    this.el.appendChild(this.svg);
    container.appendChild(this.el);

    this.status = 'idle';       // idle | drawing | struck | animating
    this.strokes = [];          // [{ el, points }]
    this.active = null;         // 지금 손으로 그리는 중인 획
    this.anim = null;
    this.pointer = null;
    this.lastTapAt = 0;

    this.el.addEventListener('pointerdown', e => this.onDown(e));
    this.el.addEventListener('pointermove', e => this.onMove(e));
    this.el.addEventListener('pointerup', e => this.onUp(e));
    this.el.addEventListener('pointercancel', () => this.onCancel());
    this.el.addEventListener('contextmenu', e => e.preventDefault());
  }

  /* ── 획 관리 ─────────────────────────────────────────────── */
  addStroke() {
    const el = document.createElementNS(NS, 'path');
    el.setAttribute('fill', STROKE.inkColor);
    this.svg.appendChild(el);
    const s = { el, points: [] };
    this.strokes.push(s);
    return s;
  }

  clearStrokes() {
    this.strokes.forEach(s => s.el.remove());
    this.strokes = [];
    this.active = null;
  }

  draw(s, fraction = 1) { s.el.setAttribute('d', buildPathD(s.points, fraction)); }
  setOpacity(v) { this.strokes.forEach(s => s.el.setAttribute('fill-opacity', v)); }

  animate(ms, fn, done) {
    if (this.anim) cancelAnimationFrame(this.anim);
    const t0 = performance.now();
    const step = now => {
      const t = clamp((now - t0) / ms, 0, 1);
      fn(t);
      if (t < 1) this.anim = requestAnimationFrame(step);
      else { this.anim = null; if (done) done(); }
    };
    this.anim = requestAnimationFrame(step);
  }

  /* ── 제스처 ──────────────────────────────────────────────── */
  onDown(e) {
    if (this.status === 'animating' || this.pointer) return;
    Sound.init();
    Sound.resume();
    this.el.setPointerCapture(e.pointerId);
    this.pointer = {
      id: e.pointerId,
      rowRect: this.el.getBoundingClientRect(),
      startX: e.clientX, startY: e.clientY,
      lastX: e.clientX, lastY: e.clientY, lastT: e.timeStamp,
      moved: 0, speed: 0,
      mode: null,                       // null | draw | erase | scroll
      dir: 0, seg: 0, reversals: 0,     // 문지르기 판정
      rubbed: 0, eraseFrom: 0, progress: 0,
    };
  }

  onMove(e) {
    const p = this.pointer;
    if (!p || e.pointerId !== p.id) return;

    const step = e.clientX - p.lastX;
    const dt = Math.max(1, e.timeStamp - p.lastT);
    p.speed = p.speed * 0.75 + (Math.abs(step) / dt) * 0.25;

    const dx = e.clientX - p.startX;
    const dy = e.clientY - p.startY;
    p.moved = Math.max(p.moved, Math.hypot(dx, dy));

    if (!p.mode) {
      if (Math.abs(dx) >= STROKE.slopPx) {
        if (Math.abs(dx) <= Math.abs(dy)) {
          p.mode = 'scroll';                 // 세로 우세 → 브라우저 스크롤에 양보
        } else if (this.status === 'struck') {
          p.mode = 'erase';
        } else if (this.status === 'idle') {
          p.mode = 'draw';
          this.beginDraw(p);
        } else {
          p.mode = 'scroll';
        }
      }
    }

    if (p.mode === 'draw') {
      this.addSample(p, e.clientX, e.clientY);
      Sound.scratch(p.speed);
    } else if (p.mode === 'erase') {
      this.trackRub(p, step);
      Sound.scratch(p.speed);
    }

    p.lastX = e.clientX; p.lastY = e.clientY; p.lastT = e.timeStamp;
  }

  onUp(e) {
    const p = this.pointer;
    if (!p || e.pointerId !== p.id) return;
    this.pointer = null;
    Sound.silence();

    if (p.mode === 'draw') { this.finishDraw(p); return; }

    if (p.mode === 'erase') {
      if (p.progress > 0 && p.progress < 1) this.restore();
      return;
    }

    /* 탭 → 더블탭 판정 */
    if (this.status === 'idle' && p.moved < 10) {
      const now = e.timeStamp;
      if (now - this.lastTapAt < STROKE.doubleTapMs) {
        this.lastTapAt = 0;
        this.autoStrike();
      } else {
        this.lastTapAt = now;
      }
    }
  }

  onCancel() {
    const p = this.pointer;
    if (!p) return;
    this.pointer = null;
    Sound.silence();
    if (p.mode === 'draw') this.rewind(() => { this.status = 'idle'; });
    else if (p.mode === 'erase' && p.progress > 0) this.restore();
  }

  /* ── 긋기 ────────────────────────────────────────────────── */
  beginDraw(p) {
    this.status = 'drawing';
    this.grain = makeGrain((Math.random() * 2147483647) | 0);

    p.rects = lineRects(this.textEl);
    p.lineIndex = lineIndexAt(p.rects, p.startY);
    const line = p.rects[p.lineIndex];

    p.lineLeft = line.left - p.rowRect.left;
    p.lineRight = line.right - p.rowRect.left;
    p.lineWidth = Math.max(1, line.width);
    p.baseY = (line.top + line.bottom) / 2 - p.rowRect.top;
    p.originX = p.startX - p.rowRect.left;
    p.originY = p.startY;
    p.minX = Infinity; p.maxX = -Infinity;

    this.clearStrokes();
    this.active = this.addStroke();
    this.active.el.setAttribute('fill-opacity', '0.88');   // 긋는 동안 살짝 옅게
    this.addSample(p, p.startX, p.startY);
  }

  /* 손가락 샘플 → 3px 간격으로 보간해서 점 추가 */
  addSample(p, clientX, clientY) {
    const s = this.active;
    if (!s) return;
    const x = clientX - p.rowRect.left;
    const g = this.grain;
    const fingerDy = (clientY - p.originY) * STROKE.followY;
    const wBase = STROKE.widthMax -
      (STROKE.widthMax - STROKE.widthMin) * clamp(p.speed / STROKE.speedRef, 0, 1);

    const mk = px => ({
      x: px,
      y: p.baseY + fingerDy + g.tilt * (px - p.originX) + g.noise(px),
      w: Math.max(0.5, wBase * g.widthJitter(px)),
    });

    const last = s.points[s.points.length - 1];
    if (!last) {
      s.points.push(mk(x));
    } else {
      const gap = x - last.x;
      const steps = Math.max(1, Math.floor(Math.abs(gap) / 3));
      for (let i = 1; i <= steps; i++) s.points.push(mk(last.x + (gap * i) / steps));
    }
    p.minX = Math.min(p.minX, x);
    p.maxX = Math.max(p.maxX, x);
    this.draw(s);
  }

  finishDraw(p) {
    const covered = Math.max(0,
      Math.min(p.maxX, p.lineRight) - Math.max(p.minX, p.lineLeft));
    if (covered / p.lineWidth >= STROKE.commitRatio) this.commit(p);
    else this.rewind(() => { this.status = 'idle'; });
  }

  /* 확정 — 손으로 그은 획은 그은 그대로 두고,
     감겨 있는 나머지 줄만 자동으로 그어 채운다. */
  commit(p) {
    this.status = 'animating';
    this.active.el.setAttribute('fill-opacity', '1');
    haptic(STROKE.hapticOnCommit);

    const others = [];
    if (STROKE.strikeAllLines) {
      p.rects.forEach((r, i) => {
        if (i !== p.lineIndex) others.push(this.buildAutoStroke(r, p.rowRect));
      });
    }
    if (!others.length) { this.settle(); return; }

    others.forEach(s => this.draw(s, 0));
    const total = STROKE.autoStrokeMs + STROKE.autoStagger * (others.length - 1);
    Sound.scratch(0.5);
    this.animate(total, t => {
      const ms = t * total;
      others.forEach((s, i) => {
        const local = clamp((ms - i * STROKE.autoStagger) / STROKE.autoStrokeMs, 0, 1);
        this.draw(s, easeOut(local));
      });
    }, () => { Sound.silence(); this.settle(); });
  }

  /* 한 줄을 왼→오로 가득 채우는 자동 획 */
  buildAutoStroke(rect, rowRect) {
    const g = makeGrain((Math.random() * 2147483647) | 0);
    const left = rect.left - rowRect.left - STROKE.overshoot;
    const right = rect.right - rowRect.left + STROKE.overshoot;
    const baseY = (rect.top + rect.bottom) / 2 - rowRect.top;
    const span = Math.max(1, right - left);

    const s = this.addStroke();
    s.el.setAttribute('fill-opacity', '1');
    for (let x = left; x <= right; x += 3) {
      const profile = Math.pow(Math.sin(Math.PI * clamp((x - left) / span, 0, 1)), 0.6);
      const w = STROKE.widthMin * 1.1 +
        (STROKE.widthMax * 0.9 - STROKE.widthMin * 1.1) * profile;
      s.points.push({
        x,
        y: baseY + g.tilt * (x - left) + g.noise(x),
        w: Math.max(0.5, w * g.widthJitter(x)),
      });
    }
    return s;
  }

  settle() {
    this.status = 'struck';
    this.el.classList.remove('pulse');
    void this.el.offsetWidth;
    this.el.classList.add('pulse');
  }

  /* ── 더블탭: 모든 줄을 자동으로 긋기 ─────────────────────── */
  autoStrike() {
    this.status = 'animating';
    const rowRect = this.el.getBoundingClientRect();
    const rects = lineRects(this.textEl);
    if (!rects.length) { this.status = 'idle'; return; }

    this.clearStrokes();
    const strokes = rects.map(r => this.buildAutoStroke(r, rowRect));
    strokes.forEach(s => this.draw(s, 0));

    const total = STROKE.autoStrokeMs + STROKE.autoStagger * (strokes.length - 1);
    Sound.init(); Sound.resume(); Sound.scratch(0.5);
    this.animate(total, t => {
      const ms = t * total;
      strokes.forEach((s, i) => {
        const local = clamp((ms - i * STROKE.autoStagger) / STROKE.autoStrokeMs, 0, 1);
        this.draw(s, easeOut(local));
      });
    }, () => {
      Sound.silence();
      haptic(STROKE.hapticOnCommit);
      this.settle();
    });
  }

  /* ── 임계값 미달: 끝에서부터 되감기 ──────────────────────── */
  rewind(done) {
    this.status = 'animating';
    const s = this.active;
    if (!s) { this.clearStrokes(); if (done) done(); return; }
    this.animate(STROKE.rewindMs, t => this.draw(s, 1 - easeIn(t)), () => {
      this.clearStrokes();
      if (done) done();
    });
  }

  /* ── 문대서 지우기 ───────────────────────────────────────── */
  trackRub(p, step) {
    if (step !== 0) {
      const dir = step > 0 ? 1 : -1;
      if (p.dir === 0) { p.dir = dir; p.seg = Math.abs(step); }
      else if (dir === p.dir) { p.seg += Math.abs(step); }
      else {
        if (p.seg >= ERASE.minSegment) {
          p.reversals++;
          if (p.reversals === ERASE.minReversals) p.eraseFrom = p.rubbed;
        }
        p.dir = dir; p.seg = Math.abs(step);
      }
    }
    p.rubbed += Math.abs(step);

    if (p.reversals < ERASE.minReversals) return;

    p.progress = clamp((p.rubbed - p.eraseFrom) / ERASE.rubDistance, 0, 1);
    this.setOpacity(1 - p.progress);

    if (p.progress >= 1) {
      this.pointer = null;
      Sound.silence();
      haptic(ERASE.hapticOnErase);
      this.clearStrokes();
      this.status = 'idle';
    }
  }

  /* 지우다 만 획은 되살아난다 */
  restore() {
    this.status = 'animating';
    const from = parseFloat(this.strokes[0] &&
      this.strokes[0].el.getAttribute('fill-opacity')) || 0;
    this.animate(STROKE.restoreMs,
      t => this.setOpacity(from + (1 - from) * t),
      () => { this.setOpacity(1); this.status = 'struck'; });
  }

  reset() {
    if (this.anim) cancelAnimationFrame(this.anim);
    this.anim = null;
    this.pointer = null;
    this.clearStrokes();
    this.status = 'idle';
  }
}

/* ═══════════════════════════════════════════════════════════════
   5. 부트스트랩
   ═══════════════════════════════════════════════════════════════ */
const list = document.getElementById('list');
const items = DEMO_ITEMS.map(text => new StrikeItem(text, list));
document.getElementById('reset').addEventListener('click', () => {
  items.forEach(it => it.reset());
});
</script>
