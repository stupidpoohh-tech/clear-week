# 로컬에서 서버까지 돌려 보고 싶을 때만 쓴다 (`npx wrangler pages dev .`).
# 실제 배포 설정은 Cloudflare Pages 대시보드에 있다 — 이 파일은 배포에 쓰이지 않는다.
name = "clear-week"
pages_build_output_dir = "."
compatibility_date = "2026-08-01"

# 대시보드에서 만들 KV를 여기서도 같은 이름으로 묶는다
# [[kv_namespaces]]
# binding = "CLEARWEEK"
# id = "<대시보드에서 만든 네임스페이스 ID>"

# 비밀값은 파일에 두지 않는다 — 대시보드나 `wrangler pages secret put`으로 넣는다
# RESEND_API_KEY / MAIL_FROM / ALLOWED_EMAILS
